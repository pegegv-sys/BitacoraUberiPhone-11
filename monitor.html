<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Monitor · Bitácora Uber</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<style>
:root{color-scheme:dark;--bg:#121211;--s1:#1a1a19;--s2:#242422;--line:#33332f;--t1:#f0efec;--t2:#c3c2b7;--t3:#8d8c84;--blue:#3987e5;--good:#2fbf71;--bad:#e66767;--warn:#f0a830}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--t1);font-family:"Segoe UI",system-ui,sans-serif}
header{height:58px;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--s1)}
header h1{font-size:18px;margin:0;font-weight:700;white-space:nowrap}
.pill{padding:5px 11px;border-radius:99px;font-size:13px;font-weight:600;background:var(--s2);color:var(--t2);white-space:nowrap}
.pill.on{background:#14402a;color:#9fe0bd}.pill.off{background:#4a1f1f;color:#f3b0b0}.pill.warn{background:#4a3a14;color:#f5d58a}
header .sp{flex:1}
header select,header button{background:var(--s2);color:var(--t1);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:14px;font-family:inherit;cursor:pointer}
#app{display:grid;grid-template-columns:1fr 400px;height:calc(100% - 58px)}
#map{height:100%;background:#1b1b1a}
aside{overflow:auto;border-left:1px solid var(--line);padding:14px;background:var(--bg)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--t2)}
.big{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.k{background:var(--s2);border-radius:10px;padding:9px 11px}
.k .l{font-size:12px;color:var(--t3)}.k .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.muted{color:var(--t3);font-size:13px}.sec{color:var(--t2)}
.up{color:var(--good)}.down{color:var(--bad)}
.estado{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--t3)}
.trip{display:flex;gap:10px;padding:9px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}
.trip:hover{background:var(--s2)}.trip:last-child{border-bottom:0}
.trip .n{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#121211;flex:none}
.trip .m{flex:1;min-width:0}.trip .r{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--s2);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--blue)}
#setup{max-width:560px;margin:60px auto;padding:0 18px}
#setup textarea{width:100%;min-height:110px;background:var(--s2);color:var(--t1);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px;font-family:inherit}
.btn{display:inline-block;background:var(--blue);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:700;cursor:pointer;margin-top:10px}
.aviso{background:#4a3a14;color:#f5d58a;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.car-ic{filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
.pulse{width:44px;height:44px;border-radius:50%;background:rgba(57,135,229,.25);position:absolute;left:-2px;top:-12px;animation:pl 2s infinite}
@keyframes pl{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.4);opacity:0}}
.oscuro .leaflet-tile{filter:brightness(.62) invert(1) contrast(2.6) hue-rotate(200deg) saturate(.35) brightness(.75)}
.leaflet-container{font-family:inherit}
.lbl{background:#121211;color:#fff;border:0;border-radius:6px;padding:2px 6px;font-weight:700;font-size:12px;box-shadow:none}
.lbl:before{display:none}
@media (max-width:900px){#app{grid-template-columns:1fr;grid-template-rows:55vh auto;height:auto}#map{height:55vh}aside{border-left:0}}
</style>
</head>

const LS='bitacoraMonitor.v1';
let cfg=null;
function leerCodigo(t){
  t=String(t||'').trim(); const m=t.match(/#k=([A-Za-z0-9_-]+)/); const c=m?m[1]:t;
  try{ const o=JSON.parse(atob(c.replace(/-/g,'+').replace(/_/g,'/'))); if(o.u&&o.c&&/^https:\/\//.test(o.u)) return {u:o.u,c:o.c}; }catch(e){}
  return null;
}
function iniciarConfig(){
  const h=leerCodigo(location.hash);
  if(h){ cfg=h; try{ localStorage.setItem(LS,JSON.stringify(cfg)); }catch(e){} history.replaceState(null,'',location.pathname); }
  else { try{ cfg=JSON.parse(localStorage.getItem(LS)); }catch(e){} }
  if(!cfg){ $('#setup').hidden=false; return false; }
  $('#app').hidden=false; return true;
}
$('#conectar').onclick=()=>{ const c=leerCodigo($('#codigo').value); if(!c){ $('#setupErr').textContent='Ese enlace no es válido. Cópialo de nuevo desde la Bitácora.'; return; }
  try{ localStorage.setItem(LS,JSON.stringify(c)); }catch(e){} location.reload(); };
$('#salir').onclick=()=>{ if(window.confirm('¿Olvidar la conexión en esta computadora?')){ try{ localStorage.removeItem(LS); }catch(e){} location.reload(); } };
const url=p=>`${cfg.u}/bitacora/${cfg.c}/${p}.json`;
async function leer(p){ const r=await fetch(url(p),{cache:'no-store'}); if(!r.ok) throw new Error(r.status===401||r.status===403?'Firebase rechazó la lectura (revisa las reglas)':'Error '+r.status); return r.json(); }

function enfocarViaje(t){ if(map && t._pts && t._pts.length>1){ seguir=false; botonSeguir(); map.fitBounds(t._pts,{padding:[60,60]}); } }

/* ---- estado ---- */
let vivo=null, dia=null, diaSel='hoy', pasadas={}, ultErr=null, prevPos=null, vel=null;
async function tickVivo(){
  try{ const v=await leer('vivo'); ultErr=null;
    if(v && v.pos && (!vivo||!vivo.pos||v.pos.ts!==vivo.pos.ts)){
      if(vivo&&vivo.pos&&v.pos.ts>vivo.pos.ts){ const km=hav(vivo.pos,v.pos), h=(v.pos.ts-vivo.pos.ts)/3600000; if(h>0){ const s=km/h; vel= s<200? s : vel; } }
      if(diaSel==='hoy') ponerCoche(v.pos);
    }
    vivo=v;
  }catch(e){ ultErr=e.message||'Sin conexión'; }
  pintar();
}
async function tickDia(){
  if(diaSel!=='hoy') return;
  try{ dia=await leer('hoy'); dibujarDia(dia,true); }catch(e){ ultErr=e.message||'Sin conexión'; }
  pintar();
}
async function cargarDias(){
  try{ const r=await fetch(url('jornadas')+'?shallow=true',{cache:'no-store'}); if(!r.ok) return; const o=await r.json(); if(!o) return;
    const sel=$('#dia'); const ids=Object.keys(o).sort().reverse();
    for(const id of ids){ if(pasadas[id]) continue; try{ pasadas[id]=await leer('jornadas/'+id); }catch(e){ continue; } }
    const lista=Object.values(pasadas).sort((a,b)=>b.inicio-a.inicio);
    sel.innerHTML='<option value="hoy">Hoy (en vivo)</option>'+lista.map(d=>`<option value="${esc(d.id)}">${new Date(d.inicio).toLocaleDateString('es-MX',{weekday:'short',day:'numeric',month:'short'})} · ${fmt$(d.ganancia)}</option>`).join('');
    sel.value=diaSel;
  }catch(e){}
}
$('#dia').onchange=e=>{ diaSel=e.target.value; if(diaSel==='hoy'){ seguir=true; botonSeguir(); dibujarDia(dia,true); if(vivo) ponerCoche(vivo.pos); } else { capaCoche&&capaCoche.clearLayers(); dibujarDia(pasadas[diaSel],false); } pintar(); };
function botonSeguir(){ $('#seguir').textContent='🎯 Seguir coche: '+(seguir?'sí':'no'); }
$('#seguir').onclick=()=>{ seguir=!seguir; botonSeguir(); if(seguir&&vivo&&vivo.pos&&map) map.setView([vivo.pos.lat,vivo.pos.lon],Math.max(map.getZoom(),14)); };
$('#tema').onclick=()=>{ oscuro=!oscuro; document.body.classList.toggle('oscuro',oscuro); $('#tema').textContent=oscuro?'🌙 Mapa oscuro':'☀️ Mapa claro'; };

function pintar(){
  const p=$('#pill'), ahora=Date.now();
  const edad = vivo&&vivo.ts? ahora-vivo.ts : Infinity;
  if(ultErr){ p.className='pill off'; p.textContent='⚠️ '+ultErr; }
  else if(!vivo){ p.className='pill warn'; p.textContent='Sin datos todavía'; }
  else if(vivo.estado==='desactivado'){ p.className='pill off'; p.textContent='Monitoreo desactivado en el teléfono'; }
  else if(edad<75000){ p.className='pill on'; p.textContent='● En línea · hace '+hace(edad); }
  else { p.className='pill warn'; p.textContent='Última señal hace '+hace(edad); }
  const pan=$('#panel'); let h='';
  if(diaSel!=='hoy'){ h+=resumenDia(pasadas[diaSel],'Día seleccionado'); h+=listaViajes(pasadas[diaSel]); pan.innerHTML=h; conectarLista(pasadas[diaSel]); return; }
  if(vivo && edad>=75000 && vivo.estado!=='desactivado') h+=`<div class="aviso">El teléfono no ha mandado datos en ${hace(edad)}. Pasa cuando la Bitácora no está en pantalla (por ejemplo, si estás usando Uber Driver), si se bloqueó la pantalla o si no hay señal. Se muestra la última ubicación conocida.</div>`;
  const est = !vivo? null : vivo.estado;
  const ESTADOS={viaje:['#2fbf71','En viaje'],libre:['#3987e5','Buscando pasaje / sin pasajero'],sin_jornada:['#8d8c84','Sin jornada activa'],cargando:['#f0a830','Cargando batería'],desactivado:['#e66767','Monitoreo desactivado']};
  const [col,txt]=ESTADOS[est]||['#8d8c84','Esperando datos…'];
  h+=`<div class="card"><h2>Estado</h2><div class="estado"><span class="dot" style="background:${col}"></span>${txt}${vivo&&vivo.viaje?' #'+vivo.viaje.n:''}</div>
    ${vivo&&vivo.pos? `<div class="sec" style="margin-top:8px;font-size:16px">📍 ${vivo.dir&&vivo.dir.calle? `<b>${esc(vivo.dir.calle)}</b>${vivo.dir.colonia?' · Col. '+esc(vivo.dir.colonia):''} · ${esc(vivo.dir.alcaldia||zona(vivo.pos))}` : `<b>${zona(vivo.pos)}</b>`}</div>
      <div class="muted">${vivo.pos.lat.toFixed(5)}, ${vivo.pos.lon.toFixed(5)} (±${vivo.pos.acc} m) · ${fmtH(vivo.pos.ts)} · <a style="color:var(--blue)" target="_blank" rel="noopener" href="https://www.google.com/maps?q=${vivo.pos.lat},${vivo.pos.lon}">Google Maps</a></div>
      ${(vivo.vel!=null||vel!=null) && edad<75000? `<div class="muted">🚀 ~${fmtN(vivo.vel!=null?vivo.vel:vel,0)} km/h${(vivo.vel!=null?vivo.vel:vel)<20&&vivo.viaje?' · <span class="down">tráfico lento</span>':''}</div>`:''}` : `<div class="muted" style="margin-top:6px">${vivo&&vivo.gps==='err'?'El GPS del teléfono no está disponible.':'Aún no hay ubicación del teléfono.'}</div>`}</div>`;
  if(vivo&&vivo.viaje){ const v=vivo.viaje, t=ahora-v.inicio; const pctD = v.distEst&&v.gpsKm? Math.min(1,v.gpsKm/v.distEst) : null, pctT = v.minEst? Math.min(1,t/(v.minEst*60000)) : null;
    h+=`<div class="card" style="border-color:#1f8a52"><h2>Viaje #${v.n} en curso</h2><div class="big">⏱ ${crono(t)}</div>
      <div class="muted">Desde ${fmtH(v.inicio)} · odómetro ${fmtN(v.kmIni,1)} km${v.autIni!=null?' · autonomía '+fmtN(v.autIni,0)+' km':''}</div>
      ${pctD!=null? `<div class="bar"><i style="width:${pctD*100}%"></i></div><div class="muted">${fmtN(v.gpsKm)} de ${fmtN(v.distEst)} km (${Math.round(pctD*100)}%)</div>`:''}
      ${pctT!=null? `<div class="muted" style="margin-top:4px">${Math.round(t/60000)} de ${v.minEst} min estimados${t>v.minEst*60000?' · <span class="down">va retrasado</span>':''}</div>`:''}
      ${v.traficoActual? `<div class="aviso" style="background:#3a1a1a;color:#ffd0d0;margin:10px 0 0">🐢 Tráfico ahora: <b>${esc(v.traficoActual.desc||'')}</b> · desde ${fmtH(v.traficoActual.ini.ts)}</div>`:''}
      ${(v.trafico||[]).map(x=>`<div class="muted" style="margin-top:6px">🐢 ${esc(x.desc||'Tramo con tráfico')} · ${fmtN(x.km)} km en ${fmtN(x.min,0)} min</div>`).join('')}</div>`; }
  if(vivo&&vivo.carga){ const c=vivo.carga; h+=`<div class="card"><h2>🔌 Cargando</h2><div class="big">${crono(ahora-c.inicio)}</div><div class="muted">${c.tipo==='rapida'?'Carga rápida 220 V':'Carga normal 127 V'} · empezó con ${c.pctIni}% a las ${fmtH(c.inicio)}</div></div>`; }
  if(vivo&&vivo.jornada){ const J=vivo.jornada, ms=ahora-J.inicio;
    h+=`<div class="card"><h2>Jornada de hoy</h2><div class="kp">
      <div class="k"><div class="l">Ganancia</div><div class="v">${fmt$(J.ganancia)}</div></div>
      <div class="k"><div class="l">Tiempo</div><div class="v">${fmtDur(ms)}</div></div>
      <div class="k"><div class="l">Viajes</div><div class="v">${J.viajes}</div></div>
      <div class="k"><div class="l">$/km en viajes</div><div class="v">${J.kmViajes>0?fmt$(J.ganancia/J.kmViajes):'—'}</div></div>
      <div class="k"><div class="l">Km en viajes</div><div class="v">${fmtN(J.kmViajes)} km</div></div>
      <div class="k"><div class="l">Recorrido GPS</div><div class="v">${fmtN(J.gpsKm)} km</div></div></div>
      <div class="muted" style="margin-top:8px">Inició ${fmtH(J.inicio)} · ${fmt$((J.ganancia||0)/Math.max(ms/3600000,.01))}/h</div></div>`; }
  else if(dia && dia.estado==='cerrada') h+=resumenDia(dia,'Última jornada');
  h+=listaViajes(dia);
  pan.innerHTML=h; conectarLista(dia);
}
function resumenDia(d,titulo){ if(!d) return ''; const pk=d.kmTotal>0? d.ganancia/d.kmTotal:0;
  return `<div class="card"><h2>${titulo}</h2><div class="sec">${new Date(d.inicio).toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'})} · ${fmtH(d.inicio)} a ${d.fin?fmtH(d.fin):'—'}</div>
    <div class="big" style="margin:6px 0">${fmt$(d.ganancia)}</div><div class="kp">
    <div class="k"><div class="l">Tiempo</div><div class="v">${fmtDur(d.ms)}</div></div><div class="k"><div class="l">Viajes</div><div class="v">${(d.viajes||[]).length}</div></div>
    <div class="k"><div class="l">Km totales</div><div class="v">${fmtN(d.kmTotal)} km</div></div><div class="k"><div class="l">$/km</div><div class="v">${fmt$(pk)}</div></div>
    <div class="k"><div class="l">Velocidad prom.</div><div class="v">${d.ms>=300000?fmtN(d.kmTotal/(d.ms/3600000),0)+' km/h':'—'}</div></div><div class="k"><div class="l">Recorrido GPS</div><div class="v">${fmtN(d.gpsKm)} km</div></div></div></div>`; }
function listaViajes(d){ const vs=(d&&d.viajes)||[]; if(!vs.length) return '';
  return `<div class="card"><h2>Viajes del día · clic para verlo en el mapa</h2>${vs.slice().reverse().map(t=>{ const km=t.kmFin-t.kmIni, dur=t.fin-t.inicio;
    const eta = t.minEst? Math.round(t.minEst-dur/60000) : null;
    return `<div class="trip" data-n="${t.n}"><div class="n" style="background:${COLORES[(t.n-1)%COLORES.length]}">${t.n}</div><div class="m">
      <div><b>${fmtH(t.inicio)}–${fmtH(t.fin)}</b> <span class="muted">· ${fmtDur(dur)} · ${fmtN(km)} km</span></div>
      <div class="muted">${t.coordIni?zona(t.coordIni):(esc(t.origen)||'—')} → ${t.coordFin?zona(t.coordFin):(esc(t.destino)||'—')}</div>
      ${(t.trafico||[]).map(x=>`<div style="font-size:13px;color:#ffb3b3">🐢 ${esc(x.desc||'Tramo con tráfico')} · ${fmtN(x.km)} km en ${fmtN(x.min,0)} min (${fmtN(x.vel,0)} km/h)</div>`).join('')}
      ${eta!=null? `<div class="${eta>0?'up':eta<0?'down':'sec'}" style="font-size:13px">${eta>0?'Llegó '+eta+' min antes':eta<0?'Llegó '+(-eta)+' min después':'Llegó en el tiempo exacto'}</div>`:''}</div>
      <div class="r">${fmt$(t.pago)}<div class="muted" style="font-weight:400">${km>0?fmt$(t.pago/km)+'/km':''}</div></div></div>`; }).join('')}</div>`; }
function conectarLista(d){ document.querySelectorAll('.trip[data-n]').forEach(el=>el.onclick=()=>{ const t=(d.viajes||[]).find(x=>x.n==el.dataset.n); if(t) enfocarViaje(t); }); }

if(iniciarConfig()){
  iniciarMapa(); botonSeguir();
  tickVivo(); tickDia(); cargarDias();
  setInterval(tickVivo,5000); setInterval(tickDia,15000); setInterval(cargarDias,120000);
  setInterval(()=>{ if(!document.hidden) pintar(); },1000);
}
</script>
</body>
</html>

</script>
<style>
:root{
  color-scheme: dark;
  --bg:#121211; --surface-1:#1a1a19; --surface-2:#242422; --line:#33332f;
  --text-primary:#f0efec; --text-secondary:#c3c2b7; --text-muted:#8d8c84;
  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70;
  --good:#2fbf71; --critical:#e66767; --accent:#3987e5;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text-primary);font-family:system-ui,-apple-system,"Roboto",sans-serif;font-size:16px}
body{padding:0 env(safe-area-inset-right) calc(76px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0;font-weight:700}
#syncBadge{font-size:12px;color:var(--text-muted)}
main{padding:12px 14px;max-width:640px;margin:0 auto}
.view{display:none}.view.active{display:block}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:var(--surface-1);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--text-muted);padding:10px 0 8px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:24px;height:24px}
nav button.active{color:var(--accent)}
.card{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;color:var(--text-secondary);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.big{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.muted{color:var(--text-muted);font-size:13px}
.sec{color:var(--text-secondary)}
.row{display:flex;gap:10px}.row>*{flex:1}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.kpi .l{font-size:12px;color:var(--text-muted)}
.kpi .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .d{font-size:12px;margin-top:2px}
.up{color:var(--good)}.down{color:var(--critical)}
label{display:block;font-size:13px;color:var(--text-secondary);margin:10px 0 4px}
input,select,textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--text-primary);border-radius:10px;padding:12px;font-size:18px;font-family:inherit}
textarea{font-size:13px;min-height:110px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;font-size:17px;font-weight:700;margin-top:12px;background:var(--accent);color:#fff}
.btn.sec2{background:var(--surface-2);color:var(--text-primary);border:1px solid var(--line)}
.btn.danger{background:#7a2626;color:#fff}
.btn.go{background:#1f8a52}
.btn.small{padding:10px;font-size:14px;margin-top:8px}
.btn:active{opacity:.8}
.pill{display:inline-block;font-size:12px;padding:3px 8px;border-radius:99px;background:var(--surface-2);color:var(--text-secondary)}
.pill.live{background:#1f8a52;color:#fff}
.gps{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-secondary);margin-top:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--text-muted)}
.dot.on{background:var(--good)}.dot.err{background:var(--critical)}
.trip{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.trip:last-child{border-bottom:0}
.rank{width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.rank.top{background:var(--series-1);color:#fff}
.trip .main{flex:1;min-width:0}
.trip .rate{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.trip .rate small{display:block;font-size:12px;color:var(--text-muted);font-weight:400}
.bar{height:6px;border-radius:3px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--series-1);border-radius:3px}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--text-secondary);padding:9px 4px;border-radius:8px;font-size:14px}
.seg button.on{background:var(--surface-1);color:var(--text-primary);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.chartbox{position:relative;height:220px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--text-muted);font-weight:500}
.empty{text-align:center;color:var(--text-muted);padding:24px 8px}
.day{padding:12px 0;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.day .top{display:flex;justify-content:space-between;align-items:baseline}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text-secondary);margin-bottom:6px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.open{display:flex}
#modal .sheet{background:var(--surface-1);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:calc(92vh - env(safe-area-inset-top));overflow:auto}
#modal h3{margin:0 0 6px;font-size:19px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:14px;display:none;z-index:30;max-width:90%}
.best{border:1px solid var(--series-1)}
details summary{cursor:pointer;color:var(--text-secondary);font-size:14px;padding:4px 0}
#np{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column;padding:calc(8px + env(safe-area-inset-top)) 14px calc(12px + env(safe-area-inset-bottom));overflow:auto}
#np.open{display:flex}
.np-top{display:flex;justify-content:space-between;align-items:center;color:var(--text-muted);font-size:14px}
.np-x{background:none;border:0;color:var(--text-secondary);font-size:16px;padding:10px 4px;font-weight:600}
.np-title{font-size:26px;font-weight:700;margin:10px 0 2px;line-height:1.2}
.np-help{font-size:14px;color:var(--text-muted)}
.np-disp{margin-top:12px;background:var(--surface-1);border:2px solid var(--line);border-radius:16px;padding:10px 16px;font-size:46px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;min-height:84px;display:flex;align-items:center;justify-content:flex-end;gap:8px;overflow:hidden}
.np-disp.focus{border-color:var(--accent)}
.np-disp.bad{border-color:var(--critical);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.np-disp .ph{color:var(--text-muted);font-weight:400;font-size:22px}
.np-disp .sug{color:var(--text-secondary)}
.np-unit{font-size:22px;color:var(--text-muted);font-weight:500}
.np-err{color:var(--critical);font-size:15px;min-height:0;margin-top:6px;font-weight:600}
.np-err:empty{display:none}
.np-extra{font-size:14px;margin-top:8px}
.np-extra:empty{display:none}
.np-ok{display:block;width:100%;border:0;border-radius:16px;padding:18px;font-size:22px;font-weight:800;margin-top:12px;background:#1f8a52;color:#fff;letter-spacing:.02em}
.np-ok:disabled{background:#2a2a28;color:#5f5e58}

<body>
<header>
  <h1>🚗 Bitácora Uber</h1>
  <span id="syncBadge">Cargando…</span>
</header>

<main>
  <!-- JORNADA -->
  <section id="v-jornada" class="view active"></section>
  <!-- RANKING -->
  <section id="v-ranking" class="view">
    <div class="seg" id="rankScope">
      <button data-s="hoy" class="on">Jornada actual</button>
      <button data-s="7">7 días</button>
      <button data-s="30">30 días</button>

    </div>
    <div class="card"><h2>Mejores viajes por $/km</h2><div id="rankList"></div></div>

</main>

<nav>
  <button data-v="jornada" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Jornada</button>
  <button data-v="ranking"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Mejores</button>
  <button data-v="historial"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Historial</button>
  <button data-v="informe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Informe</button>
</nav>

<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<div id="np" role="dialog" aria-modal="true"></div>

<script>
/* =================== Utilidades =================== */
const $ = s => document.querySelector(s);
const fmt$ = n => '$' + (isFinite(n)? n : 0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt$0 = n => '$' + Math.round(isFinite(n)?n:0).toLocaleString('es-MX');
const fmtKm = n => (isFinite(n)? n:0).toLocaleString('es-MX',{maximumFractionDigits:1}) + ' km';
const fmtNum = (n,d=1) => (isFinite(n)?n:0).toLocaleString('es-MX',{maximumFractionDigits:d});
const fmtHora = ts => new Date(ts).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
const fmtDur = ms => { if(!ms||ms<0) ms=0; const m=Math.round(ms/60000); return Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')+' min'; };
const DIAS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const DIAS_C = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const fechaLocal = ts => { const d=new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const fmtFecha = f => { const [y,m,d]=f.split('-').map(Number); const dt=new Date(y,m-1,d); return DIAS[dt.getDay()]+' '+dt.toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'}); };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const num = v => { const n=parseFloat(String(v).replace(',','.')); return isFinite(n)? n : NaN; };
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display='none',2600); }

/* =================== Datos =================== */
// jornada: {id, fecha, inicio, fin, kmInicial, kmFinal, viajes:[], viajeActivo, gpsKm, estado, updatedAt}
let jornadas = {};
const LS_KEY = 'bitacoraUber.v1';
let db = null, userId = null, dbRef = null;

let cargasS = {};   // sesiones de carga (fuera de jornada), ids "c-..."
const LS_KEY_C='bitacoraUber.cargas.v1';
const mapaDe = id => String(id).startsWith('c-')? cargasS : jornadas;
function loadLocal(){ try{ const raw=localStorage.getItem(LS_KEY); if(raw) jornadas=JSON.parse(raw)||{}; const rc=localStorage.getItem(LS_KEY_C); if(rc) cargasS=JSON.parse(rc)||{}; }catch(e){} }
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(jornadas)); localStorage.setItem(LS_KEY_C, JSON.stringify(cargasS)); }catch(e){} }

const writeQueue = {}; // por documento, una escritura a la vez
async function writeDoc(j){
  if(!dbRef) return;
  const id=j.id;
  if(writeQueue[id]){ writeQueue[id].pending=true; return; }
  writeQueue[id]={pending:false};
  try{
    do{
      writeQueue[id].pending=false;
      const cur=mapaDe(id)[id];
      if(cur) await dbRef.doc(id).set(JSON.parse(JSON.stringify(cur)));
      else await dbRef.doc(id).delete();
    }while(writeQueue[id].pending);
    setSync('ok');
  }catch(e){
    setSync('err');
    if(e && e.code==='quota_exceeded') toast('Almacenamiento lleno: borra jornadas antiguas.');
  }finally{ delete writeQueue[id]; }
}
function save(j){ j.updatedAt=Date.now(); jornadas[j.id]=j; saveLocal(); writeDoc(j); }
function saveCarga(c){ c.updatedAt=Date.now(); cargasS[c.id]=c; saveLocal(); writeDoc(c); }
function removeCarga(id){ delete cargasS[id]; saveLocal(); if(dbRef) writeDoc({id}); }
function removeJornada(id){ delete jornadas[id]; saveLocal(); if(dbRef) writeDoc({id}); }

function setSync(s){
  const b=$('#syncBadge');
  if(s==='ok') b.textContent='☁️ Guardado en la nube';
  else if(s==='local') b.textContent='📱 Guardado en este dispositivo';
  else if(s==='err') b.textContent='⚠️ Sin conexión (guardado local)';
  else b.textContent=s;
}

async function initCloud(){
  try{
    if(!window.claude || !claude.use){ setSync('local'); return; }
    const [dbNs, userNs] = await Promise.all([claude.use('db'), claude.use('user')]);
    if(!dbNs || !userNs){ setSync('local'); return; }
    const id = await userNs.id();
    if(!id){ setSync('local'); return; }
    db=dbNs; userId=id; dbRef=db.collection('data/users/'+id);
    const timer=setTimeout(()=>setSync('err'),10000);
    const snap = await dbRef.get();
    clearTimeout(timer);
    const remote={};
    snap.docs.forEach(d=>{ if(d.exists) remote[d.id]=JSON.parse(JSON.stringify(d.data())); });
    // fusionar: gana el más reciente
    const ids=new Set([...Object.keys(remote),...Object.keys(jornadas),...Object.keys(cargasS)]);
    const subir=[];
    ids.forEach(k=>{
      const M=mapaDe(k), r=remote[k], l=M[k];
      if(r && (!l || (r.updatedAt||0)>=(l.updatedAt||0))) M[k]=r;
      else if(l && (!r || (l.updatedAt||0)>(r.updatedAt||0))) subir.push(l);
    });
    saveLocal();
    setSync('ok');
    for(const j of subir) await writeDoc(j);
    render();
  }catch(e){ setSync('err'); }
}

/* =================== Cálculos =================== */
const tripKm = v => Math.max(0,(v.kmFin??0)-(v.kmIni??0));
const tripRate = v => tripKm(v)>0 ? v.pago/tripKm(v) : 0;
function jornadaActiva(){ return Object.values(jornadas).find(j=>j.estado==='abierta')||null; }
function statsJornada(j){
  const viajes=j.viajes||[];
  const ganancia=viajes.reduce((s,v)=>s+(v.pago||0),0);
  const kmViajes=viajes.reduce((s,v)=>s+tripKm(v),0);
  let ultimoOdo=j.kmFinal ?? Math.max(j.kmInicial, ...viajes.map(v=>v.kmFin||0), j.viajeActivo? j.viajeActivo.kmIni:0);
  const kmTotal=Math.max(0, ultimoOdo - j.kmInicial);
  const fin=j.fin || Date.now();
  const ms=fin-j.inicio;
  const horas=ms/3600000;
  const msViajes=viajes.reduce((s,v)=>s+Math.max(0,(v.fin||0)-(v.inicio||0)),0);
  const bat=bateriaJornada(j,kmTotal);
  return {ganancia,kmViajes,kmTotal,kmVacio:Math.max(0,kmTotal-kmViajes),ms,horas,msViajes,
    porKm: kmTotal>0? ganancia/kmTotal:0, porKmViaje: kmViajes>0? ganancia/kmViajes:0,
    porHora: horas>0? ganancia/horas:0, n:viajes.length, ...bat};
}
/* Batería: consumo % = inicial - final + lo cargado en el día.
   Autonomía real = km recorridos ÷ (consumo/100). Rendimiento = autonomía real ÷ autonomía nominal. */
const AUT_KEY='bitacoraUber.autNominal';
function autNominalDefault(){ try{ const v=num(localStorage.getItem(AUT_KEY)); if(v>0) return v; }catch(e){}
  const u=Object.values(jornadas).filter(j=>j.autNominal).sort((a,b)=>b.inicio-a.inicio)[0]; return u? u.autNominal : 160; }
function bateriaJornada(j,kmTotal){
  const nominal=j.autNominal||160;
  const cargado=(j.cargas||[]).reduce((s,c)=>s+Math.max(0,(c.despues||0)-(c.antes||0)),0);
  if(j.batIni==null || j.batFin==null) return {batOk:false, nominal, cargado};
  const consumo=j.batIni-j.batFin+cargado;
  if(!(consumo>0) || !(kmTotal>0)) return {batOk:false, nominal, cargado, consumo};
  const autReal=kmTotal/(consumo/100);
  return {batOk:true, nominal, cargado, consumo, autReal, rend:autReal/nominal*100, kmPorPct:kmTotal/consumo};
}
/* Ganancias: Uber muestra el acumulado del día; el pago de cada viaje = acumulado − suma de los viajes anteriores. */
function recalcPagos(j){
  const vs=j.viajes.slice().sort((a,b)=>a.inicio-b.inicio); let suma=0;
  vs.forEach(t=>{ if(t.acum!=null && isFinite(t.acum)) t.pago=Math.round((t.acum-suma)*100)/100; suma+=(t.pago||0); });
}
const sumaAntes=(j,inicio,excl)=>j.viajes.filter(x=>x.id!==excl && x.inicio<inicio).reduce((s,x)=>s+(x.pago||0),0);
function numViaje(t){ for(const j of Object.values(jornadas)){ const i=j.viajes.slice().sort((a,b)=>a.inicio-b.inicio).findIndex(x=>x.id===t.id); if(i>=0) return i+1; } return ''; }
function jornadaDeViaje(id){ return Object.values(jornadas).find(j=>j.viajes.some(x=>x.id===id)); }
/* Energía por viaje: autonomía consumida (km del tablero) vs. km reales del odómetro */
function tripEnergia(t){
  if(t.autIni==null||t.autFin==null) return null;
  const consumo=t.autIni-t.autFin, k=tripKm(t);
  if(!(consumo>0)||!(k>0)) return null;
  return {consumo, rend:k/consumo*100};
}
function mountGanancia(s, sumaPrev, mode, initVal, onChange){
  const box=s.querySelector('#gbox');
  const st={mode, val:initVal};
  const pago=()=> st.mode==='acum'? st.val-sumaPrev : st.val;
  const draw=()=>{
    box.innerHTML=`<label>¿Qué dato te muestra Uber?</label>
      <div class="seg" style="margin-bottom:6px"><button type="button" data-m="acum" class="${st.mode==='acum'?'on':''}">Ganancia acumulada</button><button type="button" data-m="pago" class="${st.mode==='pago'?'on':''}">Pago del viaje</button></div>
      <input id="gval" inputmode="none" readonly class="numf" data-u="$" data-t="${st.mode==='acum'?'Ganancia acumulada del día':'Pago de este viaje'}" placeholder="${st.mode==='acum'?'Total del día que te muestra Uber':'Lo que pagó este viaje'}" value="${isFinite(st.val)?st.val:''}">
      <div class="muted" id="gnote" style="margin-top:6px"></div>`;
    box.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ const p=pago(); st.mode=b.dataset.m; st.val= isFinite(p)? (st.mode==='acum'? Math.round((p+sumaPrev)*100)/100 : Math.round(p*100)/100) : NaN; draw(); onChange(); });
    box.querySelector('#gval').oninput=e=>{ st.val=num(e.target.value); note(); onChange(); };
    note();
  };
  const note=()=>{ const p=pago(); box.querySelector('#gnote').innerHTML = st.mode==='acum'
      ? `Viajes anteriores: ${fmt$(sumaPrev)} → <b class="sec">este viaje: ${isFinite(p)? fmt$(p):'—'}</b>${isFinite(p)&&p<0?' <span class="down">(menor que lo anterior, revisa)</span>':''}`
      : (sumaPrev>0 && isFinite(p)? `Acumulado del día quedaría en ${fmt$(sumaPrev+p)}`:''); };
  draw();
  return { get mode(){return st.mode}, get val(){return st.val}, pago };
}
const colorRend = r => r>=85? 'up' : r<70? 'down' : '';
function jornadasEnRango(dias){
  const arr=Object.values(jornadas).sort((a,b)=>a.inicio-b.inicio);
  if(dias==='todo') return arr;
  const desde=new Date(); desde.setHours(0,0,0,0); desde.setDate(desde.getDate()-(Number(dias)-1));
  return arr.filter(j=>j.inicio>=desde.getTime());
}

/* =================== GPS =================== */
let gpsWatch=null, gpsLast=null, gpsState='off';
function haversine(a,b){ const R=6371, r=x=>x*Math.PI/180; const dLat=r(b.lat-a.lat), dLon=r(b.lon-a.lon);
  const h=Math.sin(dLat/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLon/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
let gpsSaveT=null;
function startGPS(){
  if(gpsWatch!==null) return;
  if(!('geolocation' in navigator)){ gpsState='err'; return; }
  try{
    gpsWatch=navigator.geolocation.watchPosition(p=>{
      gpsState='on';
      const pt={lat:p.coords.latitude, lon:p.coords.longitude, acc:p.coords.accuracy};
      if(pt.acc>60){ updateGpsUI(); return; }
      if(gpsLast){
        const d=haversine(gpsLast,pt);
        if(d>=0.015 && d<2){ // filtra ruido y saltos
          const j=jornadaActiva();
          if(j){ j.gpsKm=(j.gpsKm||0)+d; if(j.viajeActivo) j.viajeActivo.gpsKm=(j.viajeActivo.gpsKm||0)+d;
            jornadas[j.id]=j; saveLocal();
            clearTimeout(gpsSaveT); gpsSaveT=setTimeout(()=>{ const jj=jornadaActiva(); if(jj) save(jj); },60000);
          }
          gpsLast=pt;
        }
      } else gpsLast=pt;
      updateGpsUI();
    }, err=>{ gpsState='err'; updateGpsUI(); stopGPS(); }, {enableHighAccuracy:true, maximumAge:5000, timeout:20000});
  }catch(e){ gpsState='err'; }
}
function stopGPS(){ if(gpsWatch!==null){ try{navigator.geolocation.clearWatch(gpsWatch);}catch(e){} } gpsWatch=null; gpsLast=null; }
function updateGpsUI(){
  const el=$('#gpsLine'); if(!el) return;
  const j=jornadaActiva();
  if(gpsState==='on') el.innerHTML='<span class="dot on"></span>GPS activo · jornada '+fmtKm(j?.gpsKm||0)+(j?.viajeActivo? ' · viaje '+fmtKm(j.viajeActivo.gpsKm||0):'');
  else if(gpsState==='err') el.innerHTML='<span class="dot err"></span>GPS no disponible aquí: usa el odómetro (los cálculos funcionan igual)';
  else el.innerHTML='<span class="dot"></span>GPS esperando señal…';
  actualizarEnVivo();
}

/* =================== Modal =================== */
function openModal(html, onMount){ $('#sheet').innerHTML=html; $('#modal').classList.add('open'); onMount&&onMount($('#sheet')); const f=$('#sheet').querySelector('input'); if(f) setTimeout(()=>f.focus(),80); }
function closeModal(){ $('#modal').classList.remove('open'); }
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });
function confirmar(msg, onOk, txtOk='Sí, continuar'){
  openModal(`<h3>${esc(msg)}</h3><button class="btn danger" id="cOk">${txtOk}</button><button class="btn sec2" id="cNo">Cancelar</button>`, s=>{
    s.querySelector('#cOk').onclick=()=>{ closeModal(); onOk(); }; s.querySelector('#cNo').onclick=closeModal; });
}
function err(s,msg){ let e=s.querySelector('.ferr'); if(!e){ e=document.createElement('p'); e.className='ferr'; e.style.color='var(--critical)'; s.querySelector('button').before(e);} e.textContent=msg; }

/* =================== Teclado numérico a pantalla completa =================== */
function askNumber(o){
  return new Promise(resolve=>{
    const np=$('#np');
    let val = (o.valor!=null && o.valor!=='' && isFinite(o.valor)) ? String(o.valor) : '';
    let sugerido = val!=='';            // el primer número tecleado reemplaza la sugerencia
    let modo=o.modo;
    const dec = o.decimales!==false;
    const getNum=()=> (val===''||val==='.')? NaN : num(val);
    const titulo=()=> typeof o.titulo==='function'? o.titulo(modo) : o.titulo;
    const ayuda=()=> typeof o.ayuda==='function'? o.ayuda(modo) : (o.ayuda||'');
    const unidad=()=> typeof o.unidad==='function'? o.unidad(modo) : (o.unidad||'');
    function fmtVal(){
      if(val==='') return `<span class="ph">${esc(o.placeholder||'Escribe el dato')}</span>`;
      const [a,b]=val.split('.'); const ent=a===''?'0':Number(a).toLocaleString('es-MX');
      const txt=(unidad()==='$'?'$':'')+ent+(val.includes('.')?'.'+(b||''):'');
      return `<span class="${sugerido?'sug':''}">${txt}</span>${unidad()&&unidad()!=='$'?`<span class="np-unit">${unidad()}</span>`:''}`;
    }
    function draw(){
      np.innerHTML=`
        <div class="np-top"><button class="np-x" data-a="cancel">✕ Cancelar</button>
          <span>${o.total>1?`Paso ${o.paso} de ${o.total}`:''}</span>
          ${o.opcional?'<button class="np-x" data-a="skip">Omitir ›</button>':'<span style="width:70px"></span>'}</div>
        ${o.modos?`<div class="seg" style="margin:10px 0 0">${o.modos.map(m=>`<button data-m="${m.id}" class="${m.id===modo?'on':''}">${m.label}</button>`).join('')}</div>`:''}
        <div class="np-title">${esc(titulo())}</div>
        <div class="np-help">${ayuda()}</div>
        <div class="np-disp focus" id="npDisp"></div>
        ${sugerido?'<div class="np-help" style="margin-top:4px">Toca Aceptar para dejar este valor o teclea uno nuevo</div>':''}
        <div class="np-err" id="npErr"></div>
        <div class="np-extra" id="npExtra"></div>
        <button class="np-ok" id="npOk">${o.okText||'Aceptar'}</button>
        <div class="np-keys">
          ${['1','2','3','4','5','6','7','8','9'].map(k=>`<button data-k="${k}">${k}</button>`).join('')}
          <button data-k="." ${dec?'':'disabled style="visibility:hidden"'}>.</button><button data-k="0">0</button><button data-k="del" aria-label="Borrar">⌫</button>
        </div>`;
      np.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>tecla(b.dataset.k));
      np.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ const nv=o.onModo? o.onModo(b.dataset.m,getNum(),modo) : null; modo=b.dataset.m;
        if(nv!=null && isFinite(nv)){ val=String(Math.round(nv*100)/100); } sugerido=false; draw(); });
      np.querySelector('[data-a="cancel"]').onclick=()=>cerrar(null);
      const sk=np.querySelector('[data-a="skip"]'); if(sk) sk.onclick=()=>cerrar({omitido:true, valor:null, modo});
      $('#npOk').onclick=aceptar;
      refresh();
    }
    function refresh(){

      else if(k==='.'){ if(dec && !val.includes('.')) val = (val===''?'0':val)+'.'; }
      else { const [, d] = val.split('.'); if(val.replace('.','').length>=9) return; if(d!=null && d.length>=2) return; val = (val==='0'? '' : val)+k; }

    }
    function aceptar(){
      const v=getNum(); if(isNaN(v)) return;

    function onKey(e){ if(/^[0-9]$/.test(e.key)) tecla(e.key); else if(e.key==='Backspace') tecla('del'); else if(e.key==='.'||e.key===',') tecla('.'); else if(e.key==='Enter'){ if(!$('#npOk').disabled) aceptar(); } else if(e.key==='Escape') cerrar(null); }
    function cerrar(r){ np.classList.remove('open'); np.innerHTML=''; document.removeEventListener('keydown',onKey); resolve(r); }
    document.addEventListener('keydown',onKey);
    np.classList.add('open'); draw();
  });
}

const fmtCrono = ms => { ms=Math.max(0,ms); const t=Math.floor(ms/1000), h=Math.floor(t/3600), m=Math.floor(t%3600/60), s=t%60;
  return (h? h+':'+String(m).padStart(2,'0') : String(m)) + ':' + String(s).padStart(2,'0'); };
function progresoViaje(j){
  const va=j.viajeActivo; if(!va) return null;
  const dist=va.distEst, trans=Date.now()-va.inicio;
  if(dist && gpsState==='on' && (va.gpsKm||0)>0) return {pct:Math.min(1,va.gpsKm/dist), rec:va.gpsKm, dist, fuente:'GPS'};
  if(dist && va.odoAct!=null) return {pct:Math.min(1,Math.max(0,(va.odoAct-va.kmIni)/dist)), rec:Math.max(0,va.odoAct-va.kmIni), dist, fuente:'odómetro'};
  if(va.minEst) return {pct:Math.min(1,trans/(va.minEst*60000)), dist, min:va.minEst, trans, fuente:'tiempo'};
  if(dist && gpsState==='on') return {pct:0, rec:0, dist, fuente:'GPS'};
  return {pct:null, dist};
}

  j.viajeActivo={id:uid(), inicio:Date.now(), kmIni:a.valor, autIni:b.omitido?null:b.valor, gpsKm:0, distEst:c.omitido?null:c.valor, minEst:d.omitido?null:d.valor}; save(j); render();
}
async function flujoTerminarViaje(j){
  const va=j.viajeActivo, n=j.viajes.length+1;
  const prevSum=j.viajes.reduce((s,x)=>s+(x.pago||0),0);
  const sug = va.gpsKm? Math.round((va.kmIni+va.gpsKm)*10)/10 : null;
  const a=await askNumber({paso:1,total:3,titulo:`Viaje #${n}: odómetro al terminar`,ayuda:`Km inicial del viaje: ${fmtNum(va.kmIni)}${va.gpsKm?' · GPS midió '+fmtKm(va.gpsKm):''}`,unidad:'km',valor:sug,
    extra:v=> v>va.kmIni? `<div class="kpi">Distancia del viaje: <b>${fmtKm(v-va.kmIni)}</b></div>`:'',
    validar:v=>v<=va.kmIni?'Debe ser mayor a '+fmtNum(va.kmIni)+' km':null}); if(!a) return;
  const k=a.valor-va.kmIni;
  const b=await askNumber({paso:2,total:3,titulo:`Viaje #${n}: autonomía al terminar`,ayuda: va.autIni!=null? `Autonomía al iniciar el viaje: ${fmtNum(va.autIni)} km`:'Km de autonomía que marca el tablero',unidad:'km',opcional:true,placeholder:'Ej. 80',
    extra:v=>{ if(va.autIni==null||!(va.autIni>v)) return ''; const c=va.autIni-v, r=k/c*100; return `<div class="kpi">Consumió <b>${fmtKm(c)}</b> de autonomía por ${fmtKm(k)} reales → rendimiento <b class="${colorRend(r)}">${fmtNum(r,1)}%</b></div>`; }}); if(!b) return;
  const af=b.omitido?null:b.valor;
  const pagoDe=(v,m)=> m==='acum'? v-prevSum : v;
  const c=await askNumber({paso:3,total:3,unidad:'$',
    titulo:m=> m==='acum'? `Viaje #${n}: ganancia acumulada` : `Viaje #${n}: pago del viaje`,
    ayuda:m=> m==='acum'? 'El total del día que te muestra Uber' : 'Lo que pagó solo este viaje',
    modos:[{id:'acum',label:'Acumulado del día'},{id:'pago',label:'Pago del viaje'}], modo: prevSum>0?'acum':'pago',
    onModo:(nuevo,v,viejo)=>{ if(!isFinite(v)||nuevo===viejo) return null; const p=pagoDe(v,viejo); return nuevo==='acum'? p+prevSum : p; },
    extra:(v,m)=>{ const p=pagoDe(v,m); return (m==='acum'?`<div class="np-help" style="margin-bottom:6px">Viajes anteriores ${fmt$(prevSum)} → <b class="sec">este viaje ${isFinite(p)?fmt$(p):'—'}</b></div>`:'')
      + `<div class="kpi">${previewViaje(k,p,va.autIni,af??NaN)}</div>`; },
    validar:(v,m)=> pagoDe(v,m)<0? 'El acumulado no puede ser menor que tus viajes anteriores ('+fmt$(prevSum)+')' : null,
    okText:'✔ Guardar viaje'}); if(!c) return;
  const p=pagoDe(c.valor,c.modo);
  j.viajes.push({id:va.id, inicio:va.inicio, fin:Date.now(), distEst:va.distEst??null, minEst:va.minEst??null, kmIni:va.kmIni, kmFin:a.valor, autIni:va.autIni??null, autFin:af, pago:r2(p), acum: c.modo==='acum'? c.valor : null, gpsKm:va.gpsKm||0});
  recalcPagos(j); j.viajeActivo=null; save(j); toast('Viaje #'+n+': '+fmt$(p)+' · '+fmt$(p/k)+'/km · duró '+fmtCrono(Date.now()-va.inicio)); render();
}
async function flujoCarga(j){
  if(j.batIni==null){
    const r=await askNumber({titulo:'Batería al iniciar la jornada',ayuda:'Porcentaje de carga cuando empezaste',unidad:'%',decimales:false,validar:v=>v>100?'Máximo 100%':null}); if(!r) return;
    j.batIni=r.valor; save(j); render(); return;
  }
  const a=await askNumber({paso:1,total:2,titulo:'Carga: % antes de conectar',ayuda:'Porcentaje de batería al llegar al cargador',unidad:'%',decimales:false,validar:v=>v>100?'Máximo 100%':null}); if(!a) return;
  const b=await askNumber({paso:2,total:2,titulo:'Carga: % al desconectar',ayuda:`Antes de cargar tenías ${a.valor}%`,unidad:'%',decimales:false,
    extra:v=> v>a.valor? `<div class="kpi">Cargaste <b>+${v-a.valor}%</b></div>`:'', validar:v=>v>100?'Máximo 100%':(v<=a.valor?'Debe ser mayor a '+a.valor+'%':null), okText:'✔ Guardar carga'}); if(!b) return;
  j.cargas=j.cargas||[]; j.cargas.push({ts:Date.now(),antes:a.valor,despues:b.valor}); save(j); toast('Carga registrada: +'+(b.valor-a.valor)+'%'); render();
}
async function flujoTerminarJornada(j){
  const odo=Math.max(j.kmInicial,...j.viajes.map(x=>x.kmFin||0));
  const T = j.batIni==null? 3 : 2;
  const a=await askNumber({paso:1,total:T,titulo:'Odómetro al terminar la jornada',ayuda:`Km al iniciar la jornada: ${fmtNum(j.kmInicial)}`,unidad:'km',valor:odo,
    extra:v=> v>=j.kmInicial? `<div class="kpi">Recorriste <b>${fmtKm(v-j.kmInicial)}</b> en la jornada</div>`:'',
    validar:v=>v<odo?'Debe ser al menos '+fmtNum(odo)+' km':null}); if(!a) return;
  let bi=j.batIni;
  if(bi==null){ const r=await askNumber({paso:2,total:T,titulo:'Batería al iniciar la jornada',ayuda:'No la registraste al empezar',unidad:'%',decimales:false,opcional:true,validar:v=>v>100?'Máximo 100%':null}); if(!r) return; bi=r.omitido?null:r.valor; }
  const b=await askNumber({paso:T,total:T,titulo:'Batería al terminar',ayuda:'Porcentaje de carga que te queda',unidad:'%',decimales:false,opcional:true,placeholder:'Ej. 35',
    validar:v=>v>100?'Máximo 100%':null, okText:'✔ Cerrar jornada'}); if(!b) return;
  j.batIni=bi; j.batFin=b.omitido?null:b.valor; j.kmFinal=a.valor; j.fin=Date.now(); j.estado='cerrada'; save(j); stopGPS();
  openModal(resumenCard(j,'Resumen de la jornada')+'<button class="btn go" id="carg">🔌 Iniciar carga de batería</button><button class="btn sec2" id="cl">Listo</button>', s3=>{
    s3.querySelector('#cl').onclick=closeModal; s3.querySelector('#carg').onclick=()=>{ closeModal(); flujoIniciarCargaS(); }; });
  render();
}

function formViaje(j, t){
  const nuevo=!t;
  const ordenados=j.viajes.slice().sort((a,b)=>a.inicio-b.inicio);
  const ultimoV=ordenados[ordenados.length-1];
  const ultimo=Math.max(j.kmInicial,...j.viajes.map(x=>x.kmFin||0));
  const inicioRef = t? t.inicio : Date.now()-20*60000;
  const sumaPrev = sumaAntes(j, inicioRef, t?.id);
  const hayDespues = t && j.viajes.some(x=>x.id!==t.id && x.inicio>t.inicio && x.acum!=null);
  openModal(`
    <h3>${nuevo?'Registrar viaje':'Editar viaje #'+numViaje(t)} <span class="muted" style="font-size:13px">${fmtFecha(j.fecha)}</span></h3>
    <div class="row"><div><label>Km inicial</label><input id="a" inputmode="none" readonly class="numf" value="${t? t.kmIni: ultimo}"></div>
    <div><label>Km final</label><input id="b" inputmode="none" readonly class="numf" value="${t? t.kmFin:''}"></div></div>
    <div class="row"><div><label>Autonomía inicial (km)</label><input id="ai" inputmode="none" readonly class="numf" data-opt value="${t? (t.autIni??''): (ultimoV?.autFin??'')}"></div>
    <div><label>Autonomía final (km)</label><input id="af" inputmode="none" readonly class="numf" data-opt value="${t? (t.autFin??''):''}"></div></div>
    <div id="gbox"></div>
    ${hayDespues?'<div class="muted" style="margin-top:6px">Si cambias la ganancia, se recalculará el pago del viaje siguiente que se registró con acumulado.</div>':''}
    <div class="row"><div><label>Hora inicio</label><input id="h1" type="time" value="${fmtHora24(t? t.inicio : inicioRef)}"></div>
    <div><label>Hora fin</label><input id="h2" type="time" value="${fmtHora24(t? t.fin : Date.now())}"></div></div>
    <div class="row"><div><label>Origen <span class="muted" style="font-size:12px">(opcional)</span></label><input id="org" type="text" maxlength="120" placeholder="Ej. Metro Constitución" value="${esc(t?.origen||'')}"></div>
    <div><label>Destino <span class="muted" style="font-size:12px">(opcional)</span></label><input id="dst" type="text" maxlength="120" placeholder="Ej. Aeropuerto T1" value="${esc(t?.destino||'')}"></div></div>
    <label>Comentarios <span class="muted" style="font-size:12px">(opcional)</span></label><textarea id="com" maxlength="500" style="font-size:16px;min-height:80px" placeholder="Ej. tráfico, propina, pasajero frecuente…">${esc(t?.comentario||'')}</textarea>
    <div id="prev" class="kpi" style="margin-top:12px"></div>
    <button class="btn go" id="ok">Guardar</button>
    ${nuevo?'':'<button class="btn danger small" id="del">Eliminar viaje</button>'}
    <button class="btn sec2" id="no">Cancelar</button>`, s=>{
      const g=mountGanancia(s, sumaPrev, t? (t.acum!=null?'acum':'pago') : (sumaPrev>0?'acum':'pago'), t? (t.acum!=null? t.acum : t.pago) : NaN, ()=>upd());
      const v=id=>{ const x=s.querySelector(id).value; return x===''? null : num(x); };
      function upd(){ const a=num(s.querySelector('#a').value), b=num(s.querySelector('#b').value);
        s.querySelector('#prev').innerHTML=previewViaje(b-a, g.pago(), v('#ai'), v('#af')??NaN); }
      s.querySelectorAll('#a,#b,#ai,#af').forEach(i=>i.oninput=upd); upd();
      s.querySelector('#no').onclick=closeModal;
      if(!nuevo) s.querySelector('#del').onclick=()=>confirmar('¿Eliminar el viaje #'+numViaje(t)+'?',()=>{ j.viajes=j.viajes.filter(x=>x.id!==t.id); recalcPagos(j); save(j); render(); },'Eliminar');
      s.querySelector('#ok').onclick=()=>{
        const a=num(s.querySelector('#a').value), b=num(s.querySelector('#b').value), ai=v('#ai'), af=v('#af');
        if(isNaN(a)||isNaN(b)||b<=a) return err(s,'El km final debe ser mayor que el inicial');
        if([ai,af].some(x=>x!=null&&(isNaN(x)||x<0))) return err(s,'Autonomía inválida');
        if(!isFinite(g.val)) return err(s,'Escribe la ganancia');
        const base = t? t.inicio : j.inicio;
        let ini=horaEnFecha(base, s.querySelector('#h1').value), fin=horaEnFecha(base, s.querySelector('#h2').value);
        if(fin<ini) fin+=86400000;
        const sp=sumaAntes(j, ini, t?.id);
        const p = g.mode==='acum'? g.val-sp : g.val;
        if(!(p>=0)) return err(s,'El acumulado no puede ser menor que los viajes anteriores ('+fmt$(sp)+')');
        const obj={...(t||{}), id:t?t.id:uid(), inicio:ini, fin, kmIni:a, kmFin:b, autIni:ai, autFin:af, pago:Math.round(p*100)/100, acum: g.mode==='acum'? g.val : null, gpsKm:t?.gpsKm||0,
          origen:s.querySelector('#org').value.trim(), destino:s.querySelector('#dst').value.trim(), comentario:s.querySelector('#com').value.trim()};
        if(nuevo) j.viajes.push(obj); else j.viajes=j.viajes.map(x=>x.id===t.id?obj:x);
        recalcPagos(j); save(j); closeModal(); toast('Viaje guardado'); render();
      };
    });
}
const fmtHora24 = ts => { const d=new Date(ts); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
function horaEnFecha(baseTs, hhmm){ const d=new Date(baseTs); const [h,m]=(hhmm||'00:00').split(':').map(Number); d.setHours(h||0,m||0,0,0); if(d.getTime()<baseTs-12*3600000) d.setDate(d.getDate()+1); return d.getTime(); }

      <div class="muted">${showDate? fmtFecha(fechaLocal(t.inicio)).replace(/ \d{4}$/,'')+' · ':''}${fmtHora(t.inicio)}–${fmtHora(t.fin)} · ${fmtDur(dur)}${dur>=120000? ' · '+fmt$0(t.pago/(dur/3600000))+'/h':''}</div>

/* =================== Barril de autonomía =================== */
const BARRIL_ROJO=31;
function mezclaColor(a,b,t){ const h=x=>[1,3,5].map(i=>parseInt(x.slice(i,i+2),16)); const A=h(a),B=h(b);
  return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join(''); }
function colorCapa(autFin,nominal){
  if(autFin<BARRIL_ROJO) return '#dc3b3b';                         // rojo: el tablero marcó menos de 31 km
  const t=Math.min(1,Math.max(0,(nominal-autFin)/(nominal-BARRIL_ROJO)));  // 0 = recién empieza, 1 = cerca de 31 km
  return t<0.5? mezclaColor('#f5d33f','#f0a830',t/0.5) : mezclaColor('#f0a830','#e2622a',(t-0.5)/0.5);
}
function datosBarril(j){
  let vs=j.viajes.filter(t=>t.autIni!=null&&t.autFin!=null).sort((a,b)=>a.inicio-b.inicio);
  let corte=0, carga=false;
  for(let i=1;i<vs.length;i++) if(vs[i].autIni>vs[i-1].autFin+1){ corte=i; carga=true; }  // hubo carga: se muestra desde la última
  return {vs:vs.slice(corte), carga};
}
function barrilSVG(j){
  const {vs,carga}=datosBarril(j);
  if(!vs.length) return '<div class="empty">Esta jornada no tiene viajes con autonomía registrada.</div>';
  const nominal=Math.max(j.autNominal||160, ...vs.map(t=>t.autIni));
  const W=384, bx=50, bw=130, rx=bw/2, ry=13, top=30, H=330, base=top+H;
  const Y=km=>top+H*(1-km/nominal), cx=bx+rx, x1=bx+bw;
  // capas: viajes y tramos entre viajes (sin pasajero)
  const capas=[];
  vs.forEach((t,i)=>{
    if(i>0 && vs[i-1].autFin>t.autIni) capas.push({tipo:'gap',de:vs[i-1].autFin,a:t.autIni});
    capas.push({tipo:'viaje',t,de:t.autIni,a:t.autFin,n:numViaje(t),color:colorCapa(t.autFin,nominal)});
  });
  const restante=vs[vs.length-1].autFin, inicio=vs[0].autIni;
  const banda=(hi,lo,fill,extra='')=>{ const y0=Y(hi), y1=Y(lo);
    return `<path d="M${bx},${y0} A${rx},${ry} 0 0 0 ${x1},${y0} L${x1},${y1} A${rx},${ry} 0 0 1 ${bx},${y1} Z" fill="${fill}" ${extra}/>`; };
  let g='';
  // cuerpo vacío
  g+=`<path d="M${bx},${Y(nominal)} L${bx},${base} A${rx},${ry} 0 0 0 ${x1},${base} L${x1},${Y(nominal)}" fill="#1e1e1c" stroke="#55554f" stroke-width="2"/>`;
  // verde restante (fondo)
  if(restante>0) g+=`<path d="M${bx},${Y(restante)} L${bx},${base} A${rx},${ry} 0 0 0 ${x1},${base} L${x1},${Y(restante)} A${rx},${ry} 0 0 1 ${bx},${Y(restante)} Z" fill="#2fa86b"/>`;
  // capas de arriba hacia abajo
  capas.forEach(c=>{ c.fill = c.tipo==='gap'? 'url(#rayas)' : c.color; g+=banda(c.de,c.a,c.fill,'stroke="#121211" stroke-width="2"');
    if(c.tipo==='viaje'){ c.real=tripKm(c.t); c.usada=c.de-c.a; c.perdida=c.usada-c.real;
      if(c.perdida>0.05) g+=banda(c.a+Math.min(c.perdida,c.usada),c.a,'url(#perdida)'); } });
  // superficie (nivel inicial) y borde superior del barril
  const topFill = capas[0]?.fill || '#2fa86b';
  g+=`<ellipse cx="${cx}" cy="${Y(inicio)}" rx="${rx}" ry="${ry}" fill="${topFill}" stroke="#121211" stroke-width="2"/>`;
  g+=`<ellipse cx="${cx}" cy="${Y(inicio)}" rx="${rx}" ry="${ry}" fill="#ffffff" opacity=".18"/>`;
  g+=`<ellipse cx="${cx}" cy="${Y(nominal)}" rx="${rx}" ry="${ry}" fill="none" stroke="#8d8c84" stroke-width="2"/>`;
  g+=`<path d="M${bx},${Y(nominal)} L${bx},${base} A${rx},${ry} 0 0 0 ${x1},${base} L${x1},${Y(nominal)}" fill="none" stroke="#8d8c84" stroke-width="2"/>`;
  // línea de 31 km
  g+=`<line x1="${bx-8}" x2="${x1+8}" y1="${Y(BARRIL_ROJO)}" y2="${Y(BARRIL_ROJO)}" stroke="#e66767" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  // eje izquierdo
  [[nominal,fmtNum(nominal,0)],[BARRIL_ROJO,'31'],[0,'0']].forEach(([k,l])=>{ g+=`<text x="${bx-12}" y="${Y(k)+4}" text-anchor="end" font-size="11" fill="${k===BARRIL_ROJO?'#e66767':'#8d8c84'}">${l} km</text>`; });
  // etiquetas a la derecha con flecha (evita encimarse)
  const etiquetas=capas.filter(c=>c.tipo==='viaje').map(c=>({c, y:(Y(c.de)+Y(c.a))/2+ry/2}));
  etiquetas.push({verde:true, y:(Y(restante)+base)/2});
  let minY=top-4; etiquetas.forEach(e=>{ e.ly=Math.max(e.y,minY); minY=e.ly+30; });
  const exceso=minY-(base+ry+30); if(exceso>0) etiquetas.forEach(e=>e.ly-=exceso*(e.ly-top)/(minY-top));
  etiquetas.forEach(e=>{
    const lx=x1+26;
    g+=`<path d="M${x1-4},${e.y} L${x1+14},${e.ly}" stroke="#8d8c84" stroke-width="1.2" fill="none"/><circle cx="${x1-4}" cy="${e.y}" r="2.5" fill="#f0efec"/>`;
    if(e.verde){
      g+=`<rect x="${lx}" y="${e.ly-11}" width="10" height="10" rx="2" fill="#2fa86b"/><text x="${lx+15}" y="${e.ly-2}" font-size="13" font-weight="700" fill="#f0efec">Restante ${fmtNum(restante,0)} km</text>`;
      g+=`<text x="${lx+15}" y="${e.ly+13}" font-size="11" fill="#8d8c84">${fmtNum(restante/nominal*100,0)}% de ${fmtNum(nominal,0)} km</text>`;
    } else {
      const t=e.c.t, en=tripEnergia(t);
      const c=e.c, sinPerd=c.perdida<=0.05;
      g+=`<rect x="${lx}" y="${e.ly-11}" width="10" height="10" rx="2" fill="${c.color}"/><text x="${lx+15}" y="${e.ly-2}" font-size="13" font-weight="700" fill="#f0efec">Viaje ${c.n} · usó ${fmtNum(c.usada)} km</text>`;
      g+=`<text x="${lx+15}" y="${e.ly+13}" font-size="11" fill="#c3c2b7">real ${fmtNum(c.real)} km · <tspan fill="${sinPerd?'#2fbf71':'#e66767'}" font-weight="700">${sinPerd? (c.perdida<-0.05?'+'+fmtNum(-c.perdida)+' km a favor':'✓ sin pérdida') : 'pérdida '+fmtNum(c.perdida)+' km'}</tspan></text>`;
    }
  });
  const tv=capas.filter(c=>c.tipo==='viaje'), totalReal=tv.reduce((s,c)=>s+c.real,0), totalPerd=tv.reduce((s,c)=>s+Math.max(0,c.perdida),0);
  const totalViajes=tv.reduce((s,c)=>s+(c.de-c.a),0), totalGap=capas.filter(c=>c.tipo==='gap').reduce((s,c)=>s+(c.de-c.a),0);
  const svg=`<svg viewBox="0 0 ${W} ${base+ry+12}" width="100%" role="img" aria-label="Barril de autonomía: inicio ${fmtNum(inicio)} km, restante ${fmtNum(restante)} km">

  return svg+`
    <div class="legend" style="margin-top:6px"><span style="--c:#2fa86b">Autonomía restante</span><span style="--c:#f5d33f">Primeros viajes</span><span style="--c:#e2622a">Viajes con autonomía baja</span><span style="--c:#dc3b3b">Terminó con &lt; 31 km</span><span style="--c:repeating-linear-gradient(-45deg,#7a4a1a 0 2px,#3b2510 2px 4px)">Pérdida (autonomía usada de más)</span>${totalGap>0?'<span style="--c:#55554f">Entre viajes (sin pasajero)</span>':''}</div>
    <div class="muted">Empezaste con ${fmtNum(inicio)} km de autonomía: ${fmtKm(totalViajes)} se usaron en viajes${totalGap>0?' y '+fmtKm(totalGap)+' entre viajes':''}; te quedan ${fmtKm(restante)}. En viajes recorriste <b class="sec">${fmtKm(totalReal)} reales</b> con ${fmtKm(totalViajes)} de autonomía: <b class="${totalPerd>0.05?'down':'up'}">${totalPerd>0.05?'pérdida total '+fmtKm(totalPerd):'sin pérdida (rendimiento máximo)'}</b>.${carga?' Hubo una carga durante la jornada: el barril empieza desde la última carga.':''}</div>

    ${tv.map(c=>`<tr><td>#${c.n}</td><td>${fmtNum(c.de)}→${fmtNum(c.a)}</td><td>${fmtNum(c.usada)}</td><td>${fmtNum(c.real)}</td>
      <td class="${c.perdida>0.05?'down':'up'}">${c.perdida>0.05? fmtNum(c.perdida) : (c.perdida<-0.05?'+'+fmtNum(-c.perdida):'0 ✓')}</td><td>${fmtNum(c.real/c.usada*100,0)}%</td></tr>`).join('')}
    <tr><td><b>Total</b></td><td></td><td><b>${fmtNum(totalViajes)}</b></td><td><b>${fmtNum(totalReal)}</b></td><td class="${totalPerd>0.05?'down':'up'}"><b>${fmtNum(totalPerd)}</b></td><td><b>${fmtNum(totalViajes?totalReal/totalViajes*100:0,0)}%</b></td></tr>
    </tbody></table>
    <div class="muted" style="margin-top:6px">Pérdida = autonomía usada − distancia real del odómetro. Si son iguales, la batería rindió al máximo (100%).</div>`;
}
function barrilCard(js){

  if(!conDatos.length) return `<div class="card"><h2>🛢️ Barril de autonomía</h2><div class="muted">Registra la autonomía al iniciar y terminar cada viaje para ver cómo se va vaciando tu batería.</div></div>`;
  return `<div class="card"><h2>🛢️ Barril de autonomía por jornada</h2>
    <select id="barrilSel" style="font-size:16px;padding:10px;margin-bottom:8px">${conDatos.map(j=>`<option value="${j.id}">${fmtFecha(j.fecha)}${j.estado==='abierta'?' (en curso)':''}</option>`).join('')}</select>

function energiaViajesInforme(js){
  const vs=[]; js.forEach(j=>j.viajes.forEach(t=>{ const en=tripEnergia(t); if(en) vs.push({t,en}); }));
  const detalle = `<div class="card"><h2>Detalle de viajes por día</h2><div class="muted" style="margin-bottom:6px">Toca ✎ en cualquier viaje para corregir kilometrajes, autonomía o ganancia.</div>
    ${js.slice().reverse().map(j=>{ const s=statsJornada(j); const vv=j.viajes.slice().sort((a,b)=>a.inicio-b.inicio);
      return `<details style="border-top:1px solid var(--line);padding:6px 0"><summary><b>${fmtFecha(j.fecha)}</b> · ${vv.length} viajes · ${fmt$0(s.ganancia)}</summary>
        ${vv.map(t=>tripRow(t,null,true)).join('')||'<div class="empty">Sin viajes</div>'}</details>`; }).join('')}</div>`;
  if(!vs.length) return `<div class="card"><h2>⚡ Rendimiento de energía por viaje</h2><div class="muted">Registra la autonomía al iniciar y terminar cada viaje para ver este análisis.</div></div>`+detalle;
  const kmT=vs.reduce((a,x)=>a+tripKm(x.t),0), cT=vs.reduce((a,x)=>a+x.en.consumo,0), prom=kmT/cT*100;
  const ord=vs.slice().sort((a,b)=>b.en.rend-a.en.rend); const n=Math.min(3,Math.ceil(ord.length/2));
  const mej=ord.slice(0,n), peo=ord.slice(-n).reverse().filter(x=>!mej.includes(x));
  return `<div class="card"><h2>⚡ Rendimiento de energía por viaje</h2>
    <div class="kpis"><div class="kpi"><div class="l">Promedio en viajes</div><div class="v ${colorRend(prom)}">${fmtNum(prom,1)}%</div><div class="d muted">${vs.length} viajes medidos</div></div>
    <div class="kpi"><div class="l">Autonomía consumida</div><div class="v">${fmtKm(cT)}</div><div class="d muted">por ${fmtKm(kmT)} reales</div></div></div>
    <h2 style="margin-top:14px">Viajes con MÁS rendimiento</h2>${mej.map(x=>tripRow(x.t,null,true)).join('')}
    ${peo.length?`<h2 style="margin-top:14px">Viajes con MENOS rendimiento</h2>${peo.map(x=>tripRow(x.t,null,true)).join('')}`:''}
  </div>`+detalle;
}
function delta(a,b){ if(!b) return '<span class="muted">sin dato previo</span>'; const p=(a-b)/b*100; return `<span class="${p>=0?'up':'down'}">${p>=0?'▲':'▼'} ${Math.abs(p).toFixed(0)}%</span> <span class="muted">vs anterior</span>`; }

      <div class="kpi"><div class="l">$/km promedio por día</div><div class="v">${fmt$(P.porKm)}</div><div class="d">${prev?delta(P.porKm,prev.porKm):''}</div></div>
      <div class="kpi"><div class="l">$/hora promedio</div><div class="v">${fmt$0(P.porH)}</div><div class="d">${prev?delta(P.porH,prev.porH):''}</div></div>
      <div class="kpi"><div class="l">Viajes</div><div class="v">${P.n}</div><div class="d">${prev?delta(P.n,prev.n):''}</div></div>

    ${energiaViajesInforme(js)}

      <div class="muted" style="margin-top:8px">Mejor día de la semana en promedio: <b class="sec">${DIAS[mejorW]}</b> (${fmt$0(Math.max(...semProm))} por jornada)${mejorHora!=null?` · Mejor hora por $/km: <b class="sec">${mejorHora}:00–${mejorHora+1}:00</b>`:''}</div>
    </div>
    <div class="card"><h2>Ganancia por día</h2><div class="legend"><span style="--c:${C.s2}">Día más productivo</span></div><div class="chartbox"><canvas id="c1"></canvas></div></div>

  mkChart('c4',{type:'bar',data:{labels:orden.map(w=>DIAS_C[w]),datasets:[barDs(semProm.map(v=>+v.toFixed(2)),orden.map(w=>w===mejorW?C.s2:C.s1))]},

        plugins:{legend:{display:false},tooltip:{...baseOpts().plugins.tooltip,callbacks:{label:c=>{ const w=orden[c.dataIndex]; return wb[w].n? ' '+fmtNum(c.parsed.y,1)+'% promedio ('+wb[w].n+' días)' : ' Sin datos'; }}}}})});
  }
  mkChart('c7',{type:'bar',data:{labels:labs,datasets:[barDs(dias.map(d=>+(d.ms/3600000).toFixed(2)),C.s1)]},
    options:baseOpts({plugins:{legend:{display:false},tooltip:{...baseOpts().plugins.tooltip,callbacks:{label:c=>' '+fmtDur(c.parsed.y*3600000)}}}})});
}

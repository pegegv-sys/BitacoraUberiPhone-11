  const nuevo=!t;
  const ordenados=j.viajes.slice().sort((a,b)=>a.inicio-b.inicio);
  const ultimoV=ordenados[ordenados.length-1];
  const ultimo=Math.max(j.kmInicial,...j.viajes.map(x=>x.kmFin||0));
  const inicioRef = t? t.inicio : Date.now()-20*60000;
  const sumaPrev = sumaAntes(j, inicioRef, t?.id);
  const hayDespues = t && j.viajes.some(x=>x.id!==t.id && x.inicio>t.inicio && x.acum!=null);
  openModal(`
    <h3>${nuevo?'Registrar viaje':'Editar viaje #'+numViaje(t)} <span class="muted" style="font-size:13px">${fmtFecha(j.fecha)}</span></h3>
    <div class="row"><div><label>Km inicial</label><input id="a" inputmode="none" readonly class="numf" value="${t? t.kmIni: ultimo}"></div>
    <div><label>Km final</label><input id="b" inputmode="none" readonly class="numf" value="${t? t.kmFin:''}"></div></div>
    <div class="row"><div><label>Autonomía inicial (km)</label><input id="ai" inputmode="none" readonly class="numf" data-opt value="${t? (t.autIni??''): (ultimoV?.autFin??'')}"></div>
    <div><label>Autonomía final (km)</label><input id="af" inputmode="none" readonly class="numf" data-opt value="${t? (t.autFin??''):''}"></div></div>
    <div id="gbox"></div>
    ${hayDespues?'<div class="muted" style="margin-top:6px">Si cambias la ganancia, se recalculará el pago del viaje siguiente que se registró con acumulado.</div>':''}
    <label>Tiempo estimado por Uber (min)</label><input id="me" inputmode="none" readonly class="numf" data-opt data-u="min" value="${t?.minEst??''}">
    <div class="row"><div><label>Hora inicio</label><input id="h1" type="time" value="${fmtHora24(t? t.inicio : inicioRef)}"></div>
    <div><label>Hora fin</label><input id="h2" type="time" value="${fmtHora24(t? t.fin : Date.now())}"></div></div>
    <div class="row"><div><label>Origen <span class="muted" style="font-size:12px">(opcional)</span></label><input id="org" type="text" maxlength="120" placeholder="Ej. Metro Constitución" value="${esc(t?.origen||'')}"></div>
    <div><label>Destino <span class="muted" style="font-size:12px">(opcional)</span></label><input id="dst" type="text" maxlength="120" placeholder="Ej. Aeropuerto T1" value="${esc(t?.destino||'')}"></div></div>
    <label>Comentarios <span class="muted" style="font-size:12px">(opcional)</span></label><textarea id="com" maxlength="500" style="font-size:16px;min-height:80px" placeholder="Ej. tráfico, propina, pasajero frecuente…">${esc(t?.comentario||'')}</textarea>
    <div id="prev" class="kpi" style="margin-top:12px"></div>
    <button class="btn go" id="ok">Guardar</button>
    ${nuevo?'':'<button class="btn danger small" id="del">Eliminar viaje</button>'}
    <button class="btn sec2" id="no">Cancelar</button>`, s=>{
      const g=mountGanancia(s, sumaPrev, t? (t.acum!=null?'acum':'pago') : (sumaPrev>0?'acum':'pago'), t? (t.acum!=null? t.acum : t.pago) : NaN, ()=>upd());
      const v=id=>{ const x=s.querySelector(id).value; return x===''? null : num(x); };
      function upd(){ const a=num(s.querySelector('#a').value), b=num(s.querySelector('#b').value);
        s.querySelector('#prev').innerHTML=previewViaje(b-a, g.pago(), v('#ai'), v('#af')??NaN); }
      s.querySelectorAll('#a,#b,#ai,#af').forEach(i=>i.oninput=upd); upd();
      s.querySelector('#no').onclick=closeModal;
      if(!nuevo) s.querySelector('#del').onclick=()=>confirmar('¿Eliminar el viaje #'+numViaje(t)+'?',()=>{ j.viajes=j.viajes.filter(x=>x.id!==t.id); recalcPagos(j); save(j); render(); },'Eliminar');
      s.querySelector('#ok').onclick=()=>{
        const a=num(s.querySelector('#a').value), b=num(s.querySelector('#b').value), ai=v('#ai'), af=v('#af');
        if(isNaN(a)||isNaN(b)||b<=a) return err(s,'El km final debe ser mayor que el inicial');
        if([ai,af].some(x=>x!=null&&(isNaN(x)||x<0))) return err(s,'Autonomía inválida');
        if(!isFinite(g.val)) return err(s,'Escribe la ganancia');
        const base = t? t.inicio : j.inicio;
        let ini=horaEnFecha(base, s.querySelector('#h1').value), fin=horaEnFecha(base, s.querySelector('#h2').value);
        if(fin<ini) fin+=86400000;
        const sp=sumaAntes(j, ini, t?.id);
        const p = g.mode==='acum'? g.val-sp : g.val;
        if(!(p>=0)) return err(s,'El acumulado no puede ser menor que los viajes anteriores ('+fmt$(sp)+')');
        const obj={...(t||{}), id:t?t.id:uid(), inicio:ini, fin, kmIni:a, kmFin:b, autIni:ai, autFin:af, pago:Math.round(p*100)/100, acum: g.mode==='acum'? g.val : null, gpsKm:t?.gpsKm||0,
          minEst: v('#me'), origen:s.querySelector('#org').value.trim(), destino:s.querySelector('#dst').value.trim(), comentario:s.querySelector('#com').value.trim()};
        if(nuevo) j.viajes.push(obj); else j.viajes=j.viajes.map(x=>x.id===t.id?obj:x);
        recalcPagos(j); save(j); closeModal(); toast('Viaje guardado'); render();
      };
    });
}
const fmtHora24 = ts => { const d=new Date(ts); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
function horaEnFecha(baseTs, hhmm){ const d=new Date(baseTs); const [h,m]=(hhmm||'00:00').split(':').map(Number); d.setHours(h||0,m||0,0,0); if(d.getTime()<baseTs-12*3600000) d.setDate(d.getDate()+1); return d.getTime(); }

function tripRow(t, rank, editable, maxRate, showDate){

      ${t.origen||t.destino? `<div class="sec" style="font-size:13px">📍 ${esc(t.origen||'—')} → ${esc(t.destino||'—')}</div>`:''}

      ${t.comentario? `<div class="muted" style="font-style:italic">💬 ${esc(t.comentario)}</div>`:''}
      ${(()=>{ const en=tripEnergia(t); return t.autIni!=null||t.autFin!=null? `<div class="muted">🔋 Autonomía ${t.autIni??'—'} → ${t.autFin??'—'} km${en?` · consumió ${fmtKm(en.consumo)} · <b class="${colorRend(en.rend)}">${fmtNum(en.rend,0)}%</b>`:''}</div>`:''; })()}
      <div class="muted">${showDate? fmtFecha(fechaLocal(t.inicio)).replace(/ \d{4}$/,'')+' · ':''}${fmtHora(t.inicio)}–${fmtHora(t.fin)} · ${fmtDur(dur)}${dur>=120000? ' · '+fmt$0(t.pago/(dur/3600000))+'/h · '+fmtNum(velocidad(k,dur),0)+' km/h':''}</div>
      ${tramosDe(t).map(x=>tramoHTML(x)).join('')}
      ${(()=>{ const e=etaInfo(t); return e? `<div style="font-size:13px">⏱ ${fmtNum(e.real,0)} de ${e.est} min estimados · <b class="${e.cls}">${e.icon} ${e.msg}</b></div>`:''; })()}

      ${maxRate? `<div class="bar"><i style="width:${Math.max(3,r/maxRate*100)}%"></i></div>`:''}

    <div class="rate">${fmt$(r)}<small>por km</small></div>

  </div>`;
}

function mostrarTexto(t,txt){ openModal(`<h3>${t}</h3><textarea readonly>${esc(txt)}</textarea><button class="btn" id="cl">Cerrar</button>`, s=>{ s.querySelector('textarea').select(); s.querySelector('#cl').onclick=closeModal; }); }
const q=x=>x? '"'+String(x).replace(/"/g,'""').replace(/\r?\n/g,' ')+'"' : '';
function csv(){
  const rows=[['Fecha','Dia','Viaje','Hora inicio','Hora fin','Km inicio','Km fin','Km','Ganancia acumulada','Pago','Costo por km','Autonomia inicio','Autonomia fin','Autonomia consumida','Rendimiento energia %','Minutos','Origen','Destino','Comentarios','Min estimados','Diferencia min (+antes/-despues)','Lat inicio','Lon inicio','Lat destino','Lon destino','Min en trafico','Tramos con trafico']];
  Object.values(jornadas).sort((a,b)=>a.inicio-b.inicio).forEach(j=>j.viajes.slice().sort((a,b)=>a.inicio-b.inicio).forEach(t=>{
    const en=tripEnergia(t);
    rows.push([j.fecha, DIAS[new Date(t.inicio).getDay()], numViaje(t), fmtHora24(t.inicio), fmtHora24(t.fin), t.kmIni, t.kmFin, tripKm(t).toFixed(1), t.acum??'', t.pago.toFixed(2), tripRate(t).toFixed(2), t.autIni??'', t.autFin??'', en?en.consumo:'', en?en.rend.toFixed(1):'', Math.round((t.fin-t.inicio)/60000), q(t.origen), q(t.destino), q(t.comentario), t.minEst??'', etaInfo(t)?.d??'', t.coordIni?.lat??'', t.coordIni?.lon??'', t.coordFin?.lat??'', t.coordFin?.lon??'', (t.trafico||[]).reduce((a,x)=>a+(x.min||0),0).toFixed(1), q((t.trafico||[]).map(x=>x.desc||'').join(' | '))]);
  }));
  return rows.map(r=>r.join(',')).join('\n');
}

function agregarPorDia(js){
  const m={};
  js.forEach(j=>{ const s=statsJornada(j); const d=m[j.fecha]||(m[j.fecha]={fecha:j.fecha,g:0,km:0,kmV:0,ms:0,n:0,bKm:0,bAut:0,bNom:0});
    d.g+=s.ganancia; d.km+=s.kmTotal; d.kmV+=s.kmViajes; d.ms+=s.ms; d.n+=s.n;
    if(s.batOk){ d.bKm+=s.kmTotal; d.bAut+=s.consumo/100; d.bNom+=s.nominal*s.consumo/100; } });
  Object.values(m).forEach(d=>{ d.rend = d.bAut>0? (d.bKm/d.bAut)/(d.bNom/d.bAut)*100 : null; d.autReal = d.bAut>0? d.bKm/d.bAut : null; });
  return Object.values(m).sort((a,b)=>a.fecha<b.fecha?-1:1);
}
function periodo(js){
  let g=0,km=0,kmV=0,ms=0,n=0,bKm=0,bC=0,bNom=0; js.forEach(j=>{ const s=statsJornada(j); g+=s.ganancia; km+=s.kmTotal; kmV+=s.kmViajes; ms+=s.ms; n+=s.n;
    if(s.batOk){ bKm+=s.kmTotal; bC+=s.consumo/100; bNom+=s.nominal*s.consumo/100; } });
  const dk=agregarPorDia(js).filter(d=>d.km>0).map(d=>d.g/d.km);
  return {g,km,kmV,ms,n, rend: bC>0? (bKm/bC)/(bNom/bC)*100 : null, autReal: bC>0? bKm/bC : null,h:ms/3600000, porKm: dk.length? dk.reduce((a,b)=>a+b,0)/dk.length : 0, porH:ms>0?g/(ms/3600000):0, porViaje:n?g/n:0};
}

/* =================== Barril de autonomía =================== */
const BARRIL_ROJO=31;
function mezclaColor(a,b,t){ const h=x=>[1,3,5].map(i=>parseInt(x.slice(i,i+2),16)); const A=h(a),B=h(b);
  return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join(''); }
function colorCapa(autFin,nominal){
  if(autFin<BARRIL_ROJO) return '#dc3b3b';                         // rojo: el tablero marcó menos de 31 km
  const t=Math.min(1,Math.max(0,(nominal-autFin)/(nominal-BARRIL_ROJO)));  // 0 = recién empieza, 1 = cerca de 31 km
  return t<0.5? mezclaColor('#f5d33f','#f0a830',t/0.5) : mezclaColor('#f0a830','#e2622a',(t-0.5)/0.5);
}
function datosBarril(j){
  let vs=j.viajes.filter(t=>t.autIni!=null&&t.autFin!=null).sort((a,b)=>a.inicio-b.inicio);
  let corte=0, carga=false;
  for(let i=1;i<vs.length;i++) if(vs[i].autIni>vs[i-1].autFin+1){ corte=i; carga=true; }  // hubo carga: se muestra desde la última
  return {vs:vs.slice(corte), carga};
}
function barrilSVG(j){
  const {vs,carga}=datosBarril(j);
  if(!vs.length) return '<div class="empty">Esta jornada no tiene viajes con autonomía registrada.</div>';
  const nominal=Math.max(j.autNominal||160, ...vs.map(t=>t.autIni));
  const W=384, bx=50, bw=130, rx=bw/2, ry=13, top=30, H=330, base=top+H;
  const Y=km=>top+H*(1-km/nominal), cx=bx+rx, x1=bx+bw;
  // capas: viajes y tramos entre viajes (sin pasajero)
  const capas=[];
  vs.forEach((t,i)=>{
    if(i>0 && vs[i-1].autFin>t.autIni) capas.push({tipo:'gap',de:vs[i-1].autFin,a:t.autIni});
    capas.push({tipo:'viaje',t,de:t.autIni,a:t.autFin,n:numViaje(t),color:colorCapa(t.autFin,nominal)});
  });
  const restante=vs[vs.length-1].autFin, inicio=vs[0].autIni;
  const banda=(hi,lo,fill,extra='')=>{ const y0=Y(hi), y1=Y(lo);
    return `<path d="M${bx},${y0} A${rx},${ry} 0 0 0 ${x1},${y0} L${x1},${y1} A${rx},${ry} 0 0 1 ${bx},${y1} Z" fill="${fill}" ${extra}/>`; };
  let g='';
  // cuerpo vacío
  g+=`<path d="M${bx},${Y(nominal)} L${bx},${base} A${rx},${ry} 0 0 0 ${x1},${base} L${x1},${Y(nominal)}" fill="#1e1e1c" stroke="#55554f" stroke-width="2"/>`;
  // verde restante (fondo)
  if(restante>0) g+=`<path d="M${bx},${Y(restante)} L${bx},${base} A${rx},${ry} 0 0 0 ${x1},${base} L${x1},${Y(restante)} A${rx},${ry} 0 0 1 ${bx},${Y(restante)} Z" fill="#2fa86b"/>`;
  // capas de arriba hacia abajo
  capas.forEach(c=>{ c.fill = c.tipo==='gap'? 'url(#rayas)' : c.color; g+=banda(c.de,c.a,c.fill,'stroke="#121211" stroke-width="2"');
    if(c.tipo==='viaje'){ c.real=tripKm(c.t); c.usada=c.de-c.a; c.perdida=c.usada-c.real;
      if(c.perdida>0.05) g+=banda(c.a+Math.min(c.perdida,c.usada),c.a,'url(#perdida)'); } });
  // superficie (nivel inicial) y borde superior del barril
  const topFill = capas[0]?.fill || '#2fa86b';
  g+=`<ellipse cx="${cx}" cy="${Y(inicio)}" rx="${rx}" ry="${ry}" fill="${topFill}" stroke="#121211" stroke-width="2"/>`;
  g+=`<ellipse cx="${cx}" cy="${Y(inicio)}" rx="${rx}" ry="${ry}" fill="#ffffff" opacity=".18"/>`;
  g+=`<ellipse cx="${cx}" cy="${Y(nominal)}" rx="${rx}" ry="${ry}" fill="none" stroke="#8d8c84" stroke-width="2"/>`;
  g+=`<path d="M${bx},${Y(nominal)} L${bx},${base} A${rx},${ry} 0 0 0 ${x1},${base} L${x1},${Y(nominal)}" fill="none" stroke="#8d8c84" stroke-width="2"/>`;
  // línea de 31 km
  g+=`<line x1="${bx-8}" x2="${x1+8}" y1="${Y(BARRIL_ROJO)}" y2="${Y(BARRIL_ROJO)}" stroke="#e66767" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  // eje izquierdo
  [[nominal,fmtNum(nominal,0)],[BARRIL_ROJO,'31'],[0,'0']].forEach(([k,l])=>{ g+=`<text x="${bx-12}" y="${Y(k)+4}" text-anchor="end" font-size="11" fill="${k===BARRIL_ROJO?'#e66767':'#8d8c84'}">${l} km</text>`; });
  // etiquetas a la derecha con flecha (evita encimarse)
  const etiquetas=capas.filter(c=>c.tipo==='viaje').map(c=>({c, y:(Y(c.de)+Y(c.a))/2+ry/2}));
  etiquetas.push({verde:true, y:(Y(restante)+base)/2});
  let minY=top-4; etiquetas.forEach(e=>{ e.ly=Math.max(e.y,minY); minY=e.ly+30; });
  const exceso=minY-(base+ry+30); if(exceso>0) etiquetas.forEach(e=>e.ly-=exceso*(e.ly-top)/(minY-top));
  etiquetas.forEach(e=>{
    const lx=x1+26;
    g+=`<path d="M${x1-4},${e.y} L${x1+14},${e.ly}" stroke="#8d8c84" stroke-width="1.2" fill="none"/><circle cx="${x1-4}" cy="${e.y}" r="2.5" fill="#f0efec"/>`;
    if(e.verde){
      g+=`<rect x="${lx}" y="${e.ly-11}" width="10" height="10" rx="2" fill="#2fa86b"/><text x="${lx+15}" y="${e.ly-2}" font-size="13" font-weight="700" fill="#f0efec">Restante ${fmtNum(restante,0)} km</text>`;
      g+=`<text x="${lx+15}" y="${e.ly+13}" font-size="11" fill="#8d8c84">${fmtNum(restante/nominal*100,0)}% de ${fmtNum(nominal,0)} km</text>`;
    } else {
      const t=e.c.t, en=tripEnergia(t);
      const c=e.c, sinPerd=c.perdida<=0.05;
      g+=`<rect x="${lx}" y="${e.ly-11}" width="10" height="10" rx="2" fill="${c.color}"/><text x="${lx+15}" y="${e.ly-2}" font-size="13" font-weight="700" fill="#f0efec">Viaje ${c.n} · usó ${fmtNum(c.usada)} km</text>`;
      g+=`<text x="${lx+15}" y="${e.ly+13}" font-size="11" fill="#c3c2b7">real ${fmtNum(c.real)} km · <tspan fill="${sinPerd?'#2fbf71':'#e66767'}" font-weight="700">${sinPerd? (c.perdida<-0.05?'+'+fmtNum(-c.perdida)+' km a favor':'✓ sin pérdida') : 'pérdida '+fmtNum(c.perdida)+' km'}</tspan></text>`;
    }
  });
  const tv=capas.filter(c=>c.tipo==='viaje'), totalReal=tv.reduce((s,c)=>s+c.real,0), totalPerd=tv.reduce((s,c)=>s+Math.max(0,c.perdida),0);
  const totalViajes=tv.reduce((s,c)=>s+(c.de-c.a),0), totalGap=capas.filter(c=>c.tipo==='gap').reduce((s,c)=>s+(c.de-c.a),0);
  const svg=`<svg viewBox="0 0 ${W} ${base+ry+12}" width="100%" role="img" aria-label="Barril de autonomía: inicio ${fmtNum(inicio)} km, restante ${fmtNum(restante)} km">
    <defs><pattern id="perdida" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="6" fill="#000" opacity=".38"/><line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="2.5" opacity=".45"/></pattern><pattern id="rayas" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#4a4a45"/><line x1="0" y1="0" x2="0" y2="8" stroke="#7d7c74" stroke-width="3"/></pattern></defs>${g}</svg>`;
  return svg+`
    <div class="legend" style="margin-top:6px"><span style="--c:#2fa86b">Autonomía restante</span><span style="--c:#f5d33f">Primeros viajes</span><span style="--c:#e2622a">Viajes con autonomía baja</span><span style="--c:#dc3b3b">Terminó con &lt; 31 km</span><span style="--c:repeating-linear-gradient(-45deg,#7a4a1a 0 2px,#3b2510 2px 4px)">Pérdida (autonomía usada de más)</span>${totalGap>0?'<span style="--c:#55554f">Entre viajes (sin pasajero)</span>':''}</div>
    <div class="muted">Empezaste con ${fmtNum(inicio)} km de autonomía: ${fmtKm(totalViajes)} se usaron en viajes${totalGap>0?' y '+fmtKm(totalGap)+' entre viajes':''}; te quedan ${fmtKm(restante)}. En viajes recorriste <b class="sec">${fmtKm(totalReal)} reales</b> con ${fmtKm(totalViajes)} de autonomía: <b class="${totalPerd>0.05?'down':'up'}">${totalPerd>0.05?'pérdida total '+fmtKm(totalPerd):'sin pérdida (rendimiento máximo)'}</b>.${carga?' Hubo una carga durante la jornada: el barril empieza desde la última carga.':''}</div>
    <table style="margin-top:10px"><thead><tr><th>Viaje</th><th>Autonomía</th><th>Usada</th><th>Real</th><th>Pérdida</th><th>Rend.</th></tr></thead><tbody>
    ${tv.map(c=>`<tr><td>#${c.n}</td><td>${fmtNum(c.de)}→${fmtNum(c.a)}</td><td>${fmtNum(c.usada)}</td><td>${fmtNum(c.real)}</td>
      <td class="${c.perdida>0.05?'down':'up'}">${c.perdida>0.05? fmtNum(c.perdida) : (c.perdida<-0.05?'+'+fmtNum(-c.perdida):'0 ✓')}</td><td>${fmtNum(c.real/c.usada*100,0)}%</td></tr>`).join('')}
    <tr><td><b>Total</b></td><td></td><td><b>${fmtNum(totalViajes)}</b></td><td><b>${fmtNum(totalReal)}</b></td><td class="${totalPerd>0.05?'down':'up'}"><b>${fmtNum(totalPerd)}</b></td><td><b>${fmtNum(totalViajes?totalReal/totalViajes*100:0,0)}%</b></td></tr>
    </tbody></table>
    <div class="muted" style="margin-top:6px">Pérdida = autonomía usada − distancia real del odómetro. Si son iguales, la batería rindió al máximo (100%).</div>`;
}

      <div class="kpi"><div class="l">Km recorridos</div><div class="v">${fmtKm(P.km)}</div><div class="d">${prev?delta(P.km,prev.km):''}</div></div>
      <div class="kpi"><div class="l">Horas trabajadas</div><div class="v">${fmtNum(P.h)} h</div><div class="d">${prev?delta(P.h,prev.h):''}</div></div>
      <div class="kpi" style="grid-column:1/-1"><div class="l">$/km ${hoyD.fecha===fechaLocal(Date.now())?'de hoy':'del '+etiquetaFecha(hoyD.fecha)}</div><div class="v">${fmt$(hoyD.km?hoyD.g/hoyD.km:0)}</div><div class="d muted">${fmt$0(hoyD.g)} de ${hoyD.n} viajes ÷ ${fmtKm(hoyD.km)}</div></div>
      <div class="kpi"><div class="l">$/km promedio por día</div><div class="v">${fmt$(P.porKm)}</div><div class="d">${prev?delta(P.porKm,prev.porKm):''}</div></div>
      <div class="kpi"><div class="l">$/hora promedio</div><div class="v">${fmt$0(P.porH)}</div><div class="d">${prev?delta(P.porH,prev.porH):''}</div></div>
      <div class="kpi"><div class="l">Viajes</div><div class="v">${P.n}</div><div class="d">${prev?delta(P.n,prev.n):''}</div></div>
      <div class="kpi"><div class="l">Pago promedio/viaje</div><div class="v">${fmt$0(P.porViaje)}</div><div class="d">${prev?delta(P.porViaje,prev.porViaje):''}</div></div>
    </div>
    ${bateriaInforme(dias,P,prev)}
    ${barrilCard(js)}
    ${energiaViajesInforme(js)}
    <div class="card best">
      <h2>🏆 Día más productivo</h2>
      <div style="font-size:20px;font-weight:700">${fmtFecha(mejorDia.fecha)}</div>
      <div class="sec">${fmt$(mejorDia.g)} · ${fmtKm(mejorDia.km)} · ${mejorDia.n} viajes · ${fmt$0(mejorDia.ms? mejorDia.g/(mejorDia.ms/3600000):0)}/h</div>
      <div class="muted" style="margin-top:8px">Mejor día de la semana en promedio: <b class="sec">${DIAS[mejorW]}</b> (${fmt$0(Math.max(...semProm))} por jornada)${mejorHora!=null?` · Mejor hora por $/km: <b class="sec">${mejorHora}:00–${mejorHora+1}:00</b>`:''}</div>
    </div>
    <div class="card"><h2>Ganancia por día</h2><div class="legend"><span style="--c:${C.s2}">Día más productivo</span></div><div class="chartbox"><canvas id="c1"></canvas></div></div>
    <div class="card"><h2>Costo por km por día</h2><div class="chartbox"><canvas id="c2"></canvas></div><div class="muted" style="margin-top:6px">Línea punteada: promedio de los $/km de cada día (${fmt$(P.porKm)}/km).</div></div>
    <div class="card"><h2>Km con pasajero vs. sin pasajero</h2>
      <div class="legend"><span style="--c:${C.s1}">Con pasajero</span><span style="--c:${C.s2}">Sin pasajero</span></div>
      <div class="chartbox"><canvas id="c3"></canvas></div><div class="muted" style="margin-top:6px">${fmtNum(pctVacio,0)}% de tus km fueron sin pasajero.</div></div>
    <div class="card"><h2>Ganancia promedio por día de la semana</h2><div class="legend"><span style="--c:${C.s2}">Mejor día</span></div><div class="chartbox"><canvas id="c4"></canvas></div></div>
    <div class="card"><h2>$/km según hora de inicio del viaje</h2><div class="chartbox"><canvas id="c5"></canvas></div></div>
    <div class="card"><h2>Distribución de viajes por $/km</h2><div class="chartbox"><canvas id="c6"></canvas></div></div>
    <div class="card"><h2>Horas trabajadas por día</h2><div class="chartbox"><canvas id="c7"></canvas></div></div>
    <div class="card"><details><summary>Ver tabla de datos por día</summary>
      <table><thead><tr><th>Día</th><th>Ganancia</th><th>Km</th><th>$/km</th><th>Horas</th><th>$/h</th><th>🔋</th></tr></thead><tbody>
      ${dias.slice().reverse().map(d=>`<tr><td>${etiquetaFecha(d.fecha)}</td><td>${fmt$0(d.g)}</td><td>${fmtNum(d.km,0)}</td><td>${fmt$(d.km?d.g/d.km:0)}</td><td>${fmtNum(d.ms/3600000)}</td><td>${fmt$0(d.ms?d.g/(d.ms/3600000):0)}</td><td>${d.rend!=null?fmtNum(d.rend,0)+'%':'—'}</td></tr>`).join('')}
      </tbody></table></details></div>`;

  const bsel=$('#barrilSel'); if(bsel) bsel.onchange=()=>{ $('#barrilBox').innerHTML=barrilSVG(jornadas[bsel.value]); };
  if(!window.Chart){ body.insertAdjacentHTML('afterbegin','<div class="card muted">Las gráficas necesitan internet la primera vez. Los números de arriba sí están completos.</div>'); return; }
  const labs=dias.map(d=>etiquetaFecha(d.fecha));
  const money={callbacks:{label:c=>' '+fmt$(c.parsed.y)}};
  mkChart('c1',{type:'bar',data:{labels:labs,datasets:[barDs(dias.map(d=>d.g),dias.map(d=>d===mejorDia?C.s2:C.s1))]},
    options:baseOpts({plugins:{legend:{display:false},tooltip:{...baseOpts().plugins.tooltip,callbacks:{label:c=>' Ganancia '+fmt$(c.parsed.y)}}}})});
  mkChart('c2',{type:'line',data:{labels:labs,datasets:[
      {label:'$/km',data:dias.map(d=>d.km?+(d.g/d.km).toFixed(2):null),borderColor:C.s1,backgroundColor:C.s1,borderWidth:2,pointRadius:4,pointHoverRadius:6,pointBorderColor:'#1a1a19',pointBorderWidth:2,tension:.25,spanGaps:true},
      {label:'Promedio',data:dias.map(()=>+P.porKm.toFixed(2)),borderColor:'#8d8c84',borderDash:[5,5],borderWidth:1.5,pointRadius:0}]},
    options:baseOpts({plugins:{legend:{display:false},tooltip:{...baseOpts().plugins.tooltip,callbacks:{label:c=>' '+c.dataset.label+': '+fmt$(c.parsed.y)}}}})});
  mkChart('c3',{type:'bar',data:{labels:labs,datasets:[
      {...barDs(dias.map(d=>+d.kmV.toFixed(1)),C.s1),label:'Con pasajero',borderRadius:0,borderWidth:{top:2},borderColor:'#1a1a19'},
      {...barDs(dias.map(d=>+Math.max(0,d.km-d.kmV).toFixed(1)),C.s2),label:'Sin pasajero'}]},
    options:baseOpts({scales:{x:{stacked:true,grid:{display:false},ticks:{color:C.tick,maxRotation:0,font:{size:11}}},y:{stacked:true,grid:{color:C.grid},ticks:{color:C.tick}}},
      plugins:{legend:{display:false},tooltip:{...baseOpts().plugins.tooltip,callbacks:{label:c=>' '+c.dataset.label+': '+fmtKm(c.parsed.y)}}}})});
  mkChart('c4',{type:'bar',data:{labels:orden.map(w=>DIAS_C[w]),datasets:[barDs(semProm.map(v=>+v.toFixed(2)),orden.map(w=>w===mejorW?C.s2:C.s1))]},
    options:baseOpts({plugins:{legend:{display:false},tooltip:{...baseOpts().plugins.tooltip,callbacks:{label:c=>{ const w=orden[c.dataIndex]; return ' '+fmt$(c.parsed.y)+' promedio ('+sem[w].c+' jornadas)'; }}}}})});
  mkChart('c5',{type:'bar',data:{labels:horasRango.map(h=>h+'h'),datasets:[barDs(horasRango.map(h=>hrs[h].km?+(hrs[h].g/hrs[h].km).toFixed(2):0),C.s1)]},
    options:baseOpts({plugins:{legend:{display:false},tooltip:{...baseOpts().plugins.tooltip,callbacks:{label:c=>{ const h=horasRango[c.dataIndex]; return ' '+fmt$(c.parsed.y)+'/km · '+hrs[h].n+' viajes'; }}}}})});
  mkChart('c6',{type:'bar',data:{labels:binLab,datasets:[barDs(binN,C.s3)]},
    options:baseOpts({plugins:{legend:{display:false},tooltip:{...baseOpts().plugins.tooltip,callbacks:{label:c=>' '+c.parsed.y+' viajes'}}},scales:{x:{grid:{display:false},ticks:{color:C.tick,maxRotation:0,font:{size:10}}},y:{beginAtZero:true,grid:{color:C.grid},ticks:{color:C.tick,precision:0}}}})});
  const dB=dias.filter(d=>d.rend!=null);
  if(dB.length){
    const mejorB=dB.reduce((a,b)=>b.rend>a.rend?b:a), peorB=dB.reduce((a,b)=>b.rend<a.rend?b:a);
    mkChart('c8',{type:'bar',data:{labels:dB.map(d=>etiquetaFecha(d.fecha)),datasets:[
        {...barDs(dB.map(d=>+d.rend.toFixed(1)),dB.map(d=>d===mejorB?C.s3:d===peorB&&dB.length>1?C.s2:C.s1)),label:'Rendimiento'},
        {type:'line',label:'Promedio',data:dB.map(()=>+P.rend.toFixed(1)),borderColor:'#8d8c84',borderDash:[5,5],borderWidth:1.5,pointRadius:0}]},
      options:baseOpts({scales:{x:{grid:{display:false},ticks:{color:C.tick,maxRotation:0,font:{size:11}}},y:{beginAtZero:true,suggestedMax:100,grid:{color:C.grid},ticks:{color:C.tick,callback:v=>v+'%'}}},
        plugins:{legend:{display:false},tooltip:{...baseOpts().plugins.tooltip,callbacks:{label:c=>{ const d=dB[c.dataIndex]; return c.dataset.label==='Promedio'? ' Promedio '+fmtNum(c.parsed.y,1)+'%' : ' '+fmtNum(d.rend,1)+'% · autonomía real '+fmtKm(d.autReal)+' · '+fmtKm(d.bKm)+' recorridos'; }}}}})});
    const wb=Array.from({length:7},()=>({km:0,c:0,nom:0,n:0}));
    dB.forEach(d=>{ const [y,m,dd]=d.fecha.split('-').map(Number); const w=new Date(y,m-1,dd).getDay(); wb[w].km+=d.bKm; wb[w].c+=d.bAut; wb[w].nom+=d.bNom; wb[w].n++; });
    const wr=orden.map(w=>wb[w].c>0? (wb[w].km/wb[w].c)/(wb[w].nom/wb[w].c)*100 : 0);
    const wmax=Math.max(...wr), wPos=wr.filter(x=>x>0), wmin=wPos.length?Math.min(...wPos):0;
    mkChart('c9',{type:'bar',data:{labels:orden.map(w=>DIAS_C[w]),datasets:[barDs(wr.map(v=>+v.toFixed(1)),wr.map(v=>v===wmax?C.s3:(v===wmin&&wPos.length>1?C.s2:C.s1)))]},
      options:baseOpts({scales:{x:{grid:{display:false},ticks:{color:C.tick,font:{size:11}}},y:{beginAtZero:true,suggestedMax:100,grid:{color:C.grid},ticks:{color:C.tick,callback:v=>v+'%'}}},
        plugins:{legend:{display:false},tooltip:{...baseOpts().plugins.tooltip,callbacks:{label:c=>{ const w=orden[c.dataIndex]; return wb[w].n? ' '+fmtNum(c.parsed.y,1)+'% promedio ('+wb[w].n+' días)' : ' Sin datos'; }}}}})});
  }
  mkChart('c7',{type:'bar',data:{labels:labs,datasets:[barDs(dias.map(d=>+(d.ms/3600000).toFixed(2)),C.s1)]},
    options:baseOpts({plugins:{legend:{display:false},tooltip:{...baseOpts().plugins.tooltip,callbacks:{label:c=>' '+fmtDur(c.parsed.y*3600000)}}}})});
}

document.addEventListener('click',e=>{ const b=e.target.closest('[data-edit]'); if(!b) return; e.preventDefault();
  const j=jornadaDeViaje(b.dataset.edit); if(j) formViaje(j, j.viajes.find(x=>x.id===b.dataset.edit)); });
function previewViaje(k,p,ai,af){
  const en=(ai!=null&&isFinite(af)&&ai>af&&k>0)? {c:ai-af, r:k/(ai-af)*100} : null;
  return `<div class="row" style="gap:8px"><div><div class="l">Distancia</div><b>${k>0?fmtKm(k):'—'}</b></div>
    <div><div class="l">Pago</div><b>${isFinite(p)?fmt$(p):'—'}</b></div><div><div class="l">$/km</div><b>${k>0&&isFinite(p)?fmt$(p/k):'—'}</b></div></div>
    ${en?`<div class="d sec" style="margin-top:6px">🔋 Consumió ${fmtKm(en.c)} de autonomía por ${fmtKm(k)} reales → rendimiento <b class="${colorRend(en.r)}">${fmtNum(en.r,1)}%</b></div>`:''}`;
}

/* =================== Navegación =================== */
let vista='jornada';
function show(v){ vista=v; document.querySelectorAll('.view').forEach(s=>s.classList.toggle('active',s.id==='v-'+v));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===v)); window.scrollTo(0,0); render(); }
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));
function render(){
  if(vista==='jornada') renderJornada();
  else if(vista==='ranking') renderRanking();
  else if(vista==='historial') renderHistorial();
  else renderInforme();
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && vista==='jornada') render(); });

loadLocal(); render(); setSync('local'); initCloud();
iniciarMapaOffline().then(m=>{ if(m) render(); });
</script>
